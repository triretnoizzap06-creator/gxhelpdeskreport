<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helpdesk Performance Report · GX CS</title>
<link rel="icon" href="mark.png">
<script>(function(){try{var m=localStorage.getItem("gx-theme");if(m==="dark"||m==="light")document.documentElement.setAttribute("data-theme",m)}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F4;--panel:rgba(255,255,255,.86);--solid:#fff;--ink:#111114;--muted:#6E6E73;--line:rgba(0,0,0,.1);--hover:rgba(0,0,0,.05);
  --y:#FFD000;--y2:#F5B800;--ytint:#FFF7D1;--blue:#2563EB;--green:#16A34A;
  --ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--disp:Archivo,Inter,"Arial Black",sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0D;--panel:rgba(24,24,27,.86);--solid:#18181B;--ink:#F5F5F7;--muted:#9A9AA0;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0D;--panel:rgba(24,24,27,.86);--solid:#18181B;--ink:#F5F5F7;--muted:#9A9AA0;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:var(--panel);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:28px;height:28px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.brand b{display:block;font-size:15px;font-weight:700;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.y{background:var(--y);color:#111;border-color:var(--y)}
.btn:disabled{opacity:.5;cursor:default}
.sel{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--hover)}
.pill i{width:8px;height:8px;border-radius:50%;background:#A1A1AA}
.pill.ok i{background:#22C55E}.pill.warn i{background:#F59E0B}.pill.err i{background:#EF4444}

/* ---------- deck (scroll view) ---------- */
.deck{max-width:1240px;margin:0 auto;padding:22px 18px 80px;display:flex;flex-direction:column;gap:22px}
.note{font-size:13px;color:var(--muted);background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--ink)}
.empty{background:var(--solid);border:1px dashed var(--line);border-radius:18px;padding:60px 20px;text-align:center}
.empty h2{margin:0 0 6px;font-family:var(--disp);font-size:24px}
.empty p{margin:0 0 18px;color:var(--muted)}

/* ---------- slide base (16:9, scales with width) ---------- */
.slide{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:14px;background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.05),0 14px 40px rgba(0,0,0,.1);font-family:var(--ui)}
.s-in{position:absolute;inset:0;padding:3.4cqw 4.4cqw 3cqw;display:flex;flex-direction:column}
.slide.dark{background:#0A0A0A;color:#fff}
.slide .edge{position:absolute;left:0;top:0;bottom:0;width:.35cqw;background:var(--y)}
.slide .edge.b{background:var(--blue)}.slide .edge.g{background:var(--green)}
.slide .topline{position:absolute;left:0;right:0;top:0;height:.35cqw;background:var(--y)}
.logo{height:1.9cqw;display:block}
.foot{position:absolute;left:4.4cqw;bottom:2cqw;font-size:1.08cqw;font-weight:700;letter-spacing:.12em;color:#A1A1AA;text-transform:uppercase}
.snum{position:absolute;right:4.4cqw;bottom:2cqw;font-size:1.08cqw;font-weight:700;letter-spacing:.12em;color:#A1A1AA}
.kick{display:flex;align-items:center;gap:.6cqw;font-size:1.16cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.tagb{display:inline-block;font-size:1.08cqw;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.3cqw .7cqw;border-radius:.4cqw;background:#111;color:#fff}
.tagb.y{background:var(--y);color:#111}.tagb.b{background:var(--blue);color:#fff}.tagb.g{background:var(--green);color:#fff}
.h2{font-family:var(--disp);font-weight:800;font-size:3cqw;letter-spacing:-.02em;line-height:1.02;margin:.6cqw 0 0}
.sub{font-size:1.2cqw;color:#71717A;margin-top:.4cqw}
.cap{font-size:1.13cqw;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#71717A}
.divchip{display:inline-block;font-size:1.01cqw;font-weight:800;letter-spacing:.06em;padding:.12cqw .45cqw;border-radius:.3cqw;border:1px solid #D4D4D8;color:#71717A;margin-left:.5cqw;vertical-align:middle}
.dark .divchip{border-color:#3F3F46;color:#A1A1AA}
.num{font-variant-numeric:tabular-nums}

/* slide 1 cover */
.cover .glow{position:absolute;right:-8cqw;top:-14cqw;width:52cqw;height:52cqw;border-radius:50%;background:radial-gradient(circle,rgba(255,208,0,.22),rgba(255,208,0,0) 65%)}
.cover .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:1.6cqw 1.6cqw}
.cover .wm{position:absolute;right:-1cqw;bottom:-6cqw;font-family:var(--disp);font-weight:900;font-size:24cqw;color:rgba(255,255,255,.035);line-height:1}
.cover .hd{display:flex;justify-content:space-between;align-items:center}
.cover .hd span{font-size:1.08cqw;font-weight:700;letter-spacing:.14em;color:#71717A}
.cover .main{flex:1;display:grid;grid-template-columns:1.35fr 1fr;align-items:center;gap:3cqw}
.cover .kick{color:var(--y)}
.cover h1{font-family:var(--disp);font-weight:900;font-size:6.3cqw;letter-spacing:-.03em;line-height:.95;margin:1.6cqw 0 .6cqw}
.cover .box{display:inline-block;background:var(--y);color:#111;font-family:var(--disp);font-weight:900;font-size:2.9cqw;letter-spacing:-.01em;padding:.5cqw 1.2cqw}
.cover .rule{width:3.6cqw;height:2px;background:#3F3F46;margin:2.4cqw 0 1.6cqw}
.cover .lede{font-size:1.26cqw;font-style:italic;color:#A1A1AA;line-height:1.55}
.cover .chips{display:flex;gap:.6cqw;margin-top:2cqw}
.cover .chips span{font-size:1.08cqw;font-weight:800;letter-spacing:.06em;padding:.45cqw .9cqw;border-radius:999px;background:#27272A;color:#E4E4E7}
.cover .chips span:first-child{background:var(--y);color:#111}
.cover .right{display:flex;flex-direction:column;align-items:center;text-align:center}
.trophy{width:7.6cqw;height:7.6cqw;border-radius:50%;border:2px solid rgba(255,208,0,.55);display:grid;place-items:center;box-shadow:0 0 0 .9cqw rgba(255,208,0,.08)}
.trophy svg{width:3cqw;height:3cqw;stroke:var(--y);fill:none;stroke-width:1.8}
.cover .bh{font-size:1.08cqw;font-weight:800;letter-spacing:.16em;color:#71717A;margin-top:2cqw}
.cover .bq{font-family:var(--disp);font-weight:900;font-size:2cqw;color:var(--y);margin-top:.3cqw}
.wtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7cqw;margin-top:2.2cqw;width:100%;max-width:24cqw}
.wtiles div{border:1px solid #27272A;background:#141416;border-radius:.6cqw;padding:.9cqw .5cqw}
.wtiles small{display:block;font-size:0.98cqw;font-weight:800;letter-spacing:.1em;color:#71717A}
.wtiles b{display:block;font-family:var(--disp);font-size:1.68cqw;color:var(--y);margin-top:.3cqw}

/* slide 2 pillars */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);margin-top:1.6cqw;flex:1}
.pillars>div{padding:0 2cqw;border-left:1px solid #E4E4E7}
.pillars>div:first-child{padding-left:0;border-left:0}
.pillars .pll{display:flex;justify-content:space-between;align-items:flex-start}
.pillars .pw{font-family:var(--disp);font-weight:900;font-size:2.4cqw}
.pillars h3{font-family:var(--disp);font-weight:800;font-size:1.8cqw;margin:.6cqw 0 .2cqw}
.pillars ul{margin:1.4cqw 0 0;padding:0;list-style:none}
.pillars li{font-size:1.24cqw;color:#3F3F46;padding:.42cqw 0 .42cqw 1cqw;position:relative}
.pillars li:before{content:"";position:absolute;left:0;top:1cqw;width:.35cqw;height:.35cqw;border-radius:50%;background:#A1A1AA}
.formula{font-size:1.26cqw;color:#52525B;margin-top:1cqw}
.blob{position:absolute;right:-8cqw;bottom:-14cqw;width:34cqw;height:34cqw;border-radius:50%;background:var(--ytint)}

/* charts */
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:3cqw;margin-top:1.4cqw;flex:1;min-height:0}
.chart{display:flex;flex-direction:column;min-height:0}
.plot{position:relative;flex:1;display:flex;margin-top:1cqw;min-height:0}
.yax{display:flex;flex-direction:column-reverse;justify-content:space-between;font-size:1.04cqw;color:#A1A1AA;padding-right:.8cqw;text-align:right;width:2.6cqw}
.area{position:relative;flex:1;border-bottom:1px solid #D4D4D8;display:flex}
.area .gl{position:absolute;left:0;right:0;border-top:1px dashed #EDEDED}
.grp{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:.35cqw;position:relative;z-index:1}
.bar1{width:2.1cqw;background:var(--c);border-radius:.15cqw .15cqw 0 0;position:relative}
.bar1 span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:1.01cqw;font-weight:700;padding-bottom:.2cqw;white-space:nowrap}
.xax{display:flex;margin-left:2.6cqw;font-size:1.13cqw;color:#71717A}
.xax span{flex:1;text-align:center;padding-top:.5cqw}
.lg{display:flex;flex-wrap:wrap;gap:.4cqw 1.2cqw;margin-top:.9cqw;font-size:1.07cqw;color:#52525B}
.lg i{display:inline-block;width:.65cqw;height:.65cqw;border-radius:.12cqw;background:var(--c);margin-right:.35cqw;vertical-align:-.05cqw;border:1px solid rgba(0,0,0,.08)}
.rank .row{display:grid;grid-template-columns:2cqw 1fr auto;column-gap:.9cqw;align-items:center;margin-bottom:1.15cqw}
.rk{width:1.7cqw;height:1.7cqw;border-radius:50%;border:1.5px solid #111;display:grid;place-items:center;font-size:1.15cqw;font-weight:800}
.rk.first{background:var(--y);border-color:var(--y)}
.rank .nm{font-size:1.26cqw;font-weight:700}
.rank .vl{font-family:var(--disp);font-size:1.38cqw;font-weight:800}
.rank .trk{grid-column:2/4;height:.32cqw;background:#F4F4F5;border-radius:999px;margin-top:.4cqw;overflow:hidden}
.rank .trk b{display:block;height:100%;background:var(--c,#A1A1AA);border-radius:999px}
.callout{font-size:1.11cqw;background:var(--ytint);color:#854D0E;border-radius:.4cqw;padding:.6cqw .9cqw;border:1px solid #FDE68A}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;margin-top:1.2cqw;margin-bottom:1.8cqw}
.stat{background:#FFFBEB;border:1px solid #FDE68A;border-radius:.6cqw;padding:1cqw 1.2cqw}
.stat b{display:block;font-family:var(--disp);font-size:1.86cqw;font-weight:800;margin:.35cqw 0 .15cqw}
.stat small{font-size:1.06cqw;color:#71717A}

/* slide 4 breakdown */
.infos{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;margin-top:1cqw}
.infos div{background:#F4F4F5;border:1px solid #E4E4E7;border-radius:.5cqw;padding:.7cqw .9cqw}
.infos b{display:block;font-size:1.01cqw;letter-spacing:.08em;text-transform:uppercase}
.infos span{display:block;font-size:1.04cqw;color:#71717A;margin-top:.25cqw;line-height:1.4}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;margin-top:1.2cqw;flex:1;min-height:0}
.bd>div{min-height:0;overflow:hidden}
.bd h4{font-family:var(--disp);font-size:1.38cqw;margin:0 0 .6cqw;padding-bottom:.4cqw;border-bottom:1.5px solid #111}
.ag{margin-bottom:.9cqw}
.ag .hd{display:flex;align-items:center;gap:.7cqw}
.ag .hd .rk{width:1.35cqw;height:1.35cqw;font-size:1.04cqw}
.ag .hd b{font-size:1.24cqw}
.ag .hd small{display:block;font-size:0.96cqw;letter-spacing:.1em;color:#A1A1AA;font-weight:700}
.ag .hd .fsc{margin-left:auto;text-align:right;font-family:var(--disp);font-size:1.74cqw;font-weight:800}
.ag .hd .fsc small{font-family:var(--ui);font-size:0.92cqw}
.mt{display:grid;grid-template-columns:1fr auto;font-size:1.07cqw;margin-top:.35cqw}
.mt b{font-weight:700}.mt i{font-style:normal;color:#A1A1AA;font-size:0.99cqw}
.mt .v{font-weight:800}
.mt .trk{grid-column:1/3;height:.28cqw;background:#F4F4F5;border-radius:999px;margin-top:.2cqw;overflow:hidden}
.mt .trk b{display:block;height:100%;background:var(--c,#A1A1AA)}
.mt .tot{grid-column:1/3;font-size:0.96cqw;color:#A1A1AA}
.core{display:flex;justify-content:space-between;font-size:1.04cqw;font-weight:800;letter-spacing:.08em;color:#71717A;border-top:1px solid #E4E4E7;margin-top:.45cqw;padding-top:.35cqw}
.core b{color:#111}
.bonus{display:flex;justify-content:space-between;align-items:center;background:#FFFBEB;border-left:.2cqw solid var(--y);padding:.4cqw .7cqw;margin-top:.35cqw;font-size:0.99cqw;font-weight:800;letter-spacing:.06em;color:#A16207}
.bonus small{display:block;font-weight:500;letter-spacing:0;color:#A1A1AA}
.bonus b{font-size:1.18cqw;color:#A16207}
.fnote{font-size:1.01cqw;color:#A1A1AA;margin-top:auto}

/* slide 5 chat */
.badges{display:flex;flex-wrap:wrap;gap:.5cqw;margin-top:1.2cqw}
.badges span{font-size:1.07cqw;font-weight:600;color:var(--blue);background:#EFF6FF;border:1px solid #DBEAFE;border-radius:.35cqw;padding:.35cqw .7cqw}
.ccards{display:grid;gap:1.1cqw;margin-top:1.8cqw}
.cc{position:relative;border-radius:.7cqw;padding:1.1cqw 1.2cqw;background:#F4F4F5;border:1px solid #E4E4E7}
.cc.top{background:#0A0A0A;color:#fff;border-color:#0A0A0A}
.cc .tie{position:absolute;top:-.6cqw;left:50%;transform:translateX(-50%);background:var(--y);color:#111;font-size:0.96cqw;font-weight:900;letter-spacing:.06em;padding:.2cqw .5cqw;border-radius:.2cqw;white-space:nowrap}
.cc .hd{display:flex;justify-content:space-between;align-items:center;font-size:0.99cqw;font-weight:800;color:#A1A1AA}
.cc .rk{width:1.25cqw;height:1.25cqw;font-size:0.99cqw;border-color:#D4D4D8;background:#E4E4E7;color:#71717A}
.cc.top .rk{background:var(--y);border-color:var(--y);color:#111}
.cc .sc{font-family:var(--disp);font-size:2.1cqw;font-weight:800;margin-top:.6cqw}
.cc.top .sc{color:var(--y)}
.cc .nm{font-size:1.11cqw;font-weight:600;margin-bottom:.7cqw}
.mrow{display:grid;grid-template-columns:2cqw 1fr 1.4cqw;align-items:center;gap:.5cqw;font-size:0.99cqw;color:#A1A1AA;margin-top:.3cqw}
.mrow .trk{height:.28cqw;border-radius:999px;background:#E4E4E7;overflow:hidden}
.cc.top .mrow .trk{background:#27272A}
.mrow .trk b{display:block;height:100%;background:var(--blue)}
.cc.top .mrow .trk b{background:var(--y)}
.mrow em{font-style:normal;text-align:right;font-weight:700;color:inherit}
.cc.top .mrow{color:#A1A1AA}.cc.top .mrow em{color:#fff}
.crit{display:grid;grid-template-columns:repeat(5,1fr);gap:.6cqw;margin-top:.8cqw}
.crit div{display:flex;align-items:center;gap:.55cqw;border:1px solid #E4E4E7;background:#FAFAFA;border-radius:.4cqw;padding:.6cqw .7cqw;font-size:1.04cqw;font-weight:600}
.crit i{flex:none;width:1.05cqw;height:1.05cqw;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-size:0.96cqw;font-weight:800;display:grid;place-items:center}

/* slide 6 attendance */
.acards{display:grid;gap:1.1cqw;margin-top:1.6cqw}
.ac{border-radius:.7cqw;background:#F4F4F5;border:1px solid #E4E4E7;padding:1.3cqw 1cqw;text-align:center;position:relative}
.ac.top{background:#0A0A0A;color:#fff;border-color:#0A0A0A}
.ac .perf{position:absolute;top:-.6cqw;right:1cqw;background:var(--y);color:#111;font-size:0.96cqw;font-weight:900;letter-spacing:.06em;padding:.2cqw .5cqw;border-radius:.2cqw}
.ring{position:relative;width:5.4cqw;height:5.4cqw;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:#E4E4E7;stroke-width:3}
.ac.top .ring .tr{stroke:#27272A}
.ring .pr{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round}
.ring div{position:absolute;inset:0;display:grid;place-items:center;align-content:center;font-family:var(--disp);font-weight:800;font-size:1.32cqw;color:var(--green)}
.ac.top .ring div{color:var(--y)}
.ring small{display:block;font-size:0.92cqw;color:#A1A1AA;font-family:var(--ui)}
.ac .sc{font-family:var(--disp);font-size:1.6cqw;font-weight:800;margin-top:.9cqw}
.ac .nm{font-size:1.06cqw;font-weight:600}
.ac .dv{font-size:0.96cqw;color:#A1A1AA;margin-top:.2cqw}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;margin-top:auto;margin-bottom:1.8cqw}
.box3{background:#F4F4F5;border:1px solid #E4E4E7;border-radius:.6cqw;padding:1.1cqw 1.2cqw}
.box3 .cap{font-size:1.01cqw;margin-bottom:.8cqw}
.fr{display:flex;gap:.7cqw;align-items:center;margin-bottom:.7cqw}
.fr i{flex:none;width:2cqw;height:1.7cqw;border-radius:.3cqw;display:grid;place-items:center;font-style:normal;font-size:1.01cqw;font-weight:800;color:#fff}
.fr b{display:block;font-size:1.11cqw}.fr small{display:block;font-size:0.98cqw;color:#71717A}
.box3 .fin{font-size:0.99cqw;color:#52525B;border-top:1px solid #E4E4E7;padding-top:.6cqw}
.box3 .an{font-size:0.99cqw;color:#52525B;border-top:1px solid #E4E4E7;padding-top:.5cqw}
.ar{display:grid;grid-template-columns:1.3cqw 1fr auto;gap:.6cqw;align-items:center;margin-bottom:.55cqw;font-size:1.06cqw}
.ar .rk{width:1.15cqw;height:1.15cqw;font-size:0.96cqw;border-color:#D4D4D8}
.ar .rk.first{background:var(--green);border-color:var(--green);color:#fff}
.ar b{font-weight:800}
.ar .trk{grid-column:2/4;height:.25cqw;background:#E4E4E7;border-radius:999px;overflow:hidden}
.ar .trk b{display:block;height:100%;background:var(--green)}

/* slide 7 winner */

function periods(extra = []) {
  const now = new Date(), lastY = Math.max(now.getFullYear() + 1, START_YEAR + 1, ...extra.map(p => +p.slice(0, 4)));
  const out = [];
  for (let y = START_YEAR; y <= lastY; y++) for (let q = 1; q <= 4; q++) if (y > START_YEAR || q >= START_Q) out.push(`${y}-Q${q}`);
  return out;
}

/* =================== skor =================== */
function normAgent(a) {
  return { name: a.name || '', div: a.div === 'AM' ? 'AM' : 'HD', photo: a.photo || '',
    csMon: n(a.csMon), csHandled: n(a.csHandled), vipTotal: n(a.vipTotal), vipSolved: n(a.vipSolved), vipRate: has(a.vipRate) ? n(a.vipRate) : null,
    chat: [0, 1, 2].map(i => (a.chat && has(a.chat[i])) ? n(a.chat[i]) : null),
    att: Object.assign({ workDays: null, sick: 0, personal: 0, alpha: 0, lateMin: 0, workMin: null, manual: null }, a.att || {}) };
}
function attScore(t) {
  if (has(t.manual)) return { score: n(t.manual), rate: null, punct: null, manual: true };
  const wd = n(t.workDays);
  if (!wd) return { score: 0, rate: null, punct: null, missing: true };
  const absent = n(t.sick) + n(t.personal) + n(t.alpha);
  const rate = Math.max(0, Math.min(100, ((wd - absent) + n(t.sick) * 0.75 + n(t.personal) * 0.5) / wd * 100));
  const punct = n(t.workMin) > 0 ? Math.max(0, (1 - n(t.lateMin) / n(t.workMin)) * 100) : 100;
  return { score: rate * 0.7 + punct * 0.3, rate, punct };
}
function compute(data) {
  const A = (data.agents || []).map(normAgent).filter(a => a.name.trim());
  const by = d => A.filter(a => a.div === d);
  const max = (arr, f) => Math.max(0, ...arr.map(f));
  const hd = by('HD'), am = by('AM');
  const mx = { mon: max(hd, a => a.csMon), hand: max(hd, a => a.csHandled), vipH: max(am, a => a.vipTotal) };
  A.forEach(a => {
    a.vip = a.vipRate != null ? a.vipRate : (a.vipTotal ? a.vipSolved / a.vipTotal * 100 : 0);
  });
  mx.vip = max(am, a => a.vip);
  const part = (v, m, w) => m > 0 ? r2(v / m * w) : 0;
  A.forEach(a => {
    if (a.div === 'HD') {
      a.parts = [
        { k: T('mon'), w: 38, v: part(a.csMon, mx.mon, 38), tot: `${fInt(a.csMon)} ${T('total')}`, val: a.csMon, max: mx.mon },
        { k: T('hand'), w: 57, v: part(a.csHandled, mx.hand, 57), tot: `${fInt(a.csHandled)} ${T('total')}`, val: a.csHandled, max: mx.hand }];
      a.bonus = part(a.csMon, mx.mon, 5);
      a.bonusLabel = T('bonusHD');
      a.bonusNote = `${fInt(a.csMon)} ${T('vsMax')} ${fInt(mx.mon)}${a.csMon === mx.mon ? ' (100%)' : ''}`;
    } else {
      a.parts = [
        { k: T('vipR'), w: 57, v: r2(a.vip / 100 * 57), tot: `${T('avg')} ${f2(a.vip)}%${a.vipTotal ? ` · ${fInt(a.vipSolved)} ${T('of')} ${fInt(a.vipTotal)} ${T('vipHandled')}` : ''}`, val: a.vip, max: 100 },
        { k: T('vipH'), w: 38, v: part(a.vipTotal, mx.vipH, 38), tot: `${fInt(a.vipTotal)} ${T('total')}`, val: a.vipTotal, max: mx.vipH }];
      a.bonus = part(a.vip, mx.vip, 5);
      a.bonusLabel = T('bonusAM');
      a.bonusNote = `${T('rateW')} ${f2(a.vip)}% ${T('vsMax')} ${f2(mx.vip)}%${a.vip === mx.vip ? ' (100%)' : ''}`;
    }
    a.core = r2(sum(a.parts.map(p => p.v)));
    a.prod = r2(Math.min(100, a.core + a.bonus));
    const cs = a.chat.filter(v => v != null);
    a.chatAvg = cs.length ? r2(sum(cs) / cs.length) : 0;
    a.attX = attScore(a.att);
    a.attS = r2(a.attX.score);
    a.final = r2(a.prod * 0.5 + a.chatAvg * 0.3 + a.attS * 0.2);
  });
  const rankBy = f => A.slice().sort((x, y) => f(y) - f(x));
  return { A, hd: rankBy(a => a.prod).filter(a => a.div === 'HD'), am: rankBy(a => a.prod).filter(a => a.div === 'AM'),
    byProd: rankBy(a => a.prod), byChat: rankBy(a => a.chatAvg), byAtt: rankBy(a => a.attS), byFinal: rankBy(a => a.final) };
}

/* =================== animasi =================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  sl.querySelectorAll('.ag,.cc,.ac,.srow,.box3,.pillars>div,.crit>div,.infos>div,.wtiles>div,.win .tiles>div,.badges>span').forEach(el => {
    const sib = [...el.parentElement.children].filter(x => x.matches('.ag,.cc,.ac,.srow,.box3,.pillars>div,.crit>div,.infos>div,.wtiles>div,.win .tiles>div,.badges>span'));
    el.dataset.k = ''; el.style.setProperty('--k', sib.indexOf(el));

  sl.querySelectorAll('.trk b').forEach(b => { const card = b.closest('[data-k]'); const rows = card ? [...card.querySelectorAll('.trk b')] : [b];
    b.style.setProperty('--k', (card ? +card.style.getPropertyValue('--k') : 0) + rows.indexOf(b) * .5); });
  sl.querySelectorAll('.ring .pr').forEach(r => { const card = r.closest('[data-k]'); r.style.setProperty('--k', card ? card.style.getPropertyValue('--k') : 0); });
  sl.querySelectorAll('.num').forEach(el => { if (el.dataset.t == null) el.dataset.t = el.textContent; });
}

  sl.querySelectorAll('.num').forEach(el => {
    const t = el.dataset.t, m = /^([^\d]*)([\d,]+(?:\.(\d+))?)(.*)$/.exec(t || '');
    if (!m || RM) { if (t != null) el.textContent = t; return; }

    const card = el.closest('[data-k]'), delay = 250 + (card ? +card.style.getPropertyValue('--k') || 0 : 0) * 120, dur = 1300;
    const fmt = v => { const x = v.toFixed(dec); return comma || to >= 1000 ? Number(x).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : x; };

      el.textContent = m[1] + fmt(to * e) + m[4]; if (p < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = t; };
    requestAnimationFrame(step);

}

function reset(sl) { sl.classList.remove('play'); sl.querySelectorAll('.num').forEach(el => { if (el.dataset.t != null) el.textContent = el.dataset.t; }); }

  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = 360, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d'), m = Math.min(img.width, img.height);
      g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = rej; img.src = url; });
}
$('#edBody').addEventListener('input', e => {
  const el = e.target; if (!el.dataset.p) return;
  const card = el.closest('[data-i]'); const v = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
  if (el.hasAttribute('data-root')) { ED.attNote = v; return; }
  if (!card) return;
  setPath(ED.agents[+card.dataset.i], el.dataset.p, v);
  if (el.dataset.p === 'div') { drawEditor(); return; }
  const C = compute(ED), L = C.A.find(a => a.name === (ED.agents[+card.dataset.i].name || '').trim());
  card.querySelector('.live').innerHTML = L ? `Final <b>${f2(L.final)}</b> · PRD ${f2(L.prod)} · CHT ${f2(L.chatAvg)} · ATD ${f2(L.attS)}` : '';
});
$('#edBody').addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.p === 'div') { setPath(ED.agents[+el.closest('[data-i]').dataset.i], 'div', el.value); drawEditor(); }
  if (el.hasAttribute('data-photo') && el.files[0]) {
    try { ED.agents[+el.closest('[data-i]').dataset.i].photo = await resizePhoto(el.files[0]); drawEditor(); } catch (err) { toast('Foto tidak bisa dibaca'); }
  }
});
$('#edBody').addEventListener('click', e => {
  const card = e.target.closest('[data-i]');
  if (e.target.id === 'addAgent') { ED.agents.push(blankAgent()); drawEditor(); return; }
  if (!card) return;
  const i = +card.dataset.i;
  if (e.target.hasAttribute('data-del')) { ED.agents.splice(i, 1); drawEditor(); }
  if (e.target.hasAttribute('data-rmphoto')) { ED.agents[i].photo = ''; drawEditor(); }
});
$('#edCancel').onclick = closeEditor;
$('#editor').addEventListener('click', e => { if (e.target.id === 'editor') closeEditor(); });
$('#edSave').onclick = async () => {
  const k = $('#pubKey'); if (k) ls.set(KEY_PUB, k.value);
  const clean = { attNote: ED.attNote || '', agents: ED.agents.filter(a => (a.name || '').trim()) };
  const btn = $('#edSave'); btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    const r = await api('?period=' + encodeURIComponent(ST.period), { method: 'POST', body: JSON.stringify({ data: clean, revision: ST.revision }) });
    if (r.status === 200 && r.j.ok) {
      ST.data = clean; ST.revision = r.j.revision; ST.source = 'online'; ST.online = true;
      ls.set(CACHE + ST.period, JSON.stringify({ data: clean, revision: ST.revision }));
      closeEditor(); await loadList(); fillPeriods(); render(); syncStatus(); toast('Tersimpan online ✓ — semua orang melihat data ini');
    } else if (r.status === 409) { toast('Ada perubahan lebih baru dari perangkat lain — data dimuat ulang, cek lalu simpan lagi.'); const keep = ED; await loadPeriod(ST.period); ED = keep; ED && drawEditor(); }
    else if (r.status === 401) toast('Password publish salah / belum diisi.');
    else toast('Gagal menyimpan: ' + (r.j.detail || r.j.error || ('HTTP ' + r.status)));
  } catch (err) { toast('Server tidak terjangkau — data belum tersimpan.'); }
  btn.disabled = false; btn.textContent = 'Simpan online';
};

/* =================== mode viewer / admin =================== */
const VIEW = new URLSearchParams(location.search).has('view');
const canEdit = () => !VIEW && (ST.open || ST.authed);
function applyMode() {
  $('#editBtn').classList.toggle('hidden', !canEdit());
  $('#shareBtn').classList.toggle('hidden', !canEdit());
  $('#adminBtn').classList.toggle('hidden', VIEW || ST.open || !!ST.authed || ST.online !== true);
  const e = $('#emptyEdit'); if (e) e.classList.toggle('hidden', !canEdit());
}
async function verifyKey(key) {
  try { const r = await fetch(API + '?check=1', { method: 'POST', headers: { 'x-publish-key': key } }); return r.status === 200; } catch (e) { return false; }
}
$('#adminBtn').onclick = () => { $('#lgErr').textContent = ''; $('#login').classList.remove('hidden'); $('#lgKey').focus(); };
$('#lgCancel').onclick = () => $('#login').classList.add('hidden');
$('#loginForm').onsubmit = async e => { e.preventDefault(); const k = $('#lgKey').value;
  if (await verifyKey(k)) { ls.set(KEY_PUB, k); ST.authed = true; $('#login').classList.add('hidden'); applyMode(); toast('Mode admin aktif'); }
  else $('#lgErr').textContent = 'Password salah.'; };
$('#shareBtn').onclick = async () => { const u = location.origin + location.pathname + '?view=1#' + ST.period;
  try { await navigator.clipboard.writeText(u); toast('Link viewer disalin — orang lain hanya bisa melihat'); } catch (e) { prompt('Salin link viewer:', u); } };
function applyLangUI() { document.documentElement.lang = LANG; document.querySelectorAll('#langSw [data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG)); }
$('#langSw').onclick = e => { const b = e.target.closest('[data-lang]'); if (!b) return; LANG = b.dataset.lang; ls.set('gx-dash-lang', LANG); applyLangUI(); if (ST.period) render(); };
applyLangUI();

/* =================== init =================== */
$('#period').onchange = e => loadPeriod(e.target.value);
$('#editBtn').onclick = () => { if (canEdit()) openEditor(); };
$('#presentBtn').onclick = () => present(0);
$('#printBtn').onclick = () => window.print();
(async () => {
  await loadList();
  if (!ST.open && ST.online === true && ls.get(KEY_PUB)) ST.authed = await verifyKey(ls.get(KEY_PUB));
  ST.period = defaultPeriod(); fillPeriods();
  await loadPeriod(ST.period);
  // cek perubahan dari perangkat lain tiap 30 detik
  setInterval(async () => {
    if (ST.editing || PV || document.hidden || ST.online !== true) return;
    try { const r = await api('?list=1'); if (r.status !== 200) return; const it = (r.j.items || []).find(x => x.period === ST.period);
      if (it && it.revision !== ST.revision) { await loadPeriod(ST.period); toast('Data diperbarui dari perangkat lain'); } } catch (e) {}
  }, 30000);
})();
</script>
