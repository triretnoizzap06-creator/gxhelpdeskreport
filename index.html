<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GX CS Dashboard</title>
<link rel="icon" href="mark.png">
<script>(function(){try{var m=localStorage.getItem("gx-theme");if(m==="dark"||m==="light")document.documentElement.setAttribute("data-theme",m)}catch(e){}})()</script>
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--line:#D2D2D7;--line-h:#F5C518;
  --y1:#FFC93C;--y2:#F5A70A;--chip:#FFF6D1;--chip-ink:#7A5B00;--soon:#F2F2F4;--shadow:0 10px 30px rgba(0,0,0,.08);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0D;--card:#161618;--ink:#F5F5F7;--muted:#98989D;--line:#2C2C2E;--chip:#3A3115;--chip-ink:#FFD866;--soon:#232326;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0D;--card:#161618;--ink:#F5F5F7;--muted:#98989D;--line:#2C2C2E;--chip:#3A3115;--chip-ink:#FFD866;--soon:#232326;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{height:26px;display:block}
.logo.dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
:root[data-theme="dark"] .logo.lt{display:none}:root[data-theme="dark"] .logo.dk{display:block}
.top .sp{flex:1}
.pill{font:600 13px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:transparent}
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:72px 20px 48px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
.lede{margin:0 0 20px;color:var(--ink);opacity:.85;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.tag-f{font:600 13px var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tag-f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{margin-left:auto;font:14px var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:150px;padding:22px 16px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none;text-align:center;transition:border-color .15s,box-shadow .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--line-h);box-shadow:var(--shadow);transform:translateY(-2px);outline:none}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--y1),var(--y2));box-shadow:0 4px 10px rgba(245,167,10,.35)}
.ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.name{font-size:16px;font-weight:600;line-height:1.25}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 9px}
.card.soon{cursor:default;opacity:.7;padding-top:34px}
.card.soon .ic{filter:grayscale(.6)}
.badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:var(--soon);color:var(--muted);border-radius:999px;padding:3px 8px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.lang button{font:700 12px var(--font);background:transparent;color:var(--muted);border:0;padding:7px 11px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}.theme svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.theme .moon{display:none}:root[data-theme="dark"] .theme .sun{display:none}:root[data-theme="dark"] .theme .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:none}:root:not([data-theme="light"]) .theme .moon{display:block}}
@media (max-width:600px){.hide-sm{display:none}}
.empty{color:var(--muted);font-size:14px;padding:30px 0}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:0 28px;padding:16px 0 22px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer b{color:#E0A800;font-weight:600}
@media (max-width:600px){main{padding:32px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:130px;padding:16px 10px}.name{font-size:14px}.search{width:100%;margin-left:0}footer{margin:0 16px}}
</style>
</head>
<body>
<header class="top">
  <img class="logo lt" src="wordmark.png" alt="GlobalXtreme">
  <img class="logo dk" src="wordmark-white.png" alt="GlobalXtreme">
  <div class="sp"></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="id">ID</button><button data-lang="en">EN</button>
  </div>
  <button class="theme" id="themeBtn" type="button" aria-label="Dark / light mode"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span></span></button>
  <span class="pill hide-sm">Customer Service</span>
</header>

<main>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <div class="tools">
    <div id="tagFilter" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <input class="search" id="q" type="search">
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span>© <span id="yr"></span> GlobalXtreme — Customer Service Division</span>
  <span>Design &amp; Development By <b>GlobalXtreme</b></span>
</footer>

<script>
/* ====== DAFTAR MENU ======
   Tambah menu baru cukup dengan menambah 1 baris di sini.
   href   : halaman tujuan (kosongkan '' bila belum ada → tampil "Segera hadir")
   tags   : label kecil di bawah nama menu
   icon   : report | chart | users | headset | star | doc                        */
const MENUS = [
  { name: 'Helpdesk Report',             tags: ['Aftersales'], href: '/helpdesk-report', icon: 'report' },
  { name: 'Helpdesk Performance Report', tags: ['Best Employee'], href: '/helpdesk-performance', icon: 'star'   },
  { name: 'Helpdesk Employee Directory', tags: ['Helpdesk'],      href: '/helpdesk-directory',   icon: 'users'  },
];

/* Teks dashboard dalam 2 bahasa */
const TXT = {
  id: { light: 'Terang', dark: 'Gelap', title: 'All Report CS', lede: 'Pilih menu report di bawah. Semua data tersimpan online, jadi siapa pun yang membuka link melihat data yang sama.',
        all: 'Semua', search: 'Cari menu…', soon: 'Segera hadir', empty: 'Menu tidak ditemukan.' },
  en: { light: 'Light', dark: 'Dark', title: 'All CS Reports', lede: 'Choose a report below. All data is stored online, so everyone who opens the link sees the same data.',
        all: 'All', search: 'Search menu…', soon: 'Coming soon', empty: 'No menu found.' },
};
let lang = 'id';
try { const v = localStorage.getItem('gx-dash-lang'); if (v === 'en' || v === 'id') lang = v; } catch (e) {}
const t = k => TXT[lang][k];

const ICONS = {
  report:  '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 17v-3M13 17v-5M16 17v-2"/>',
  chart:   '<path d="M4 20h16"/><path d="M6 16l4-5 3 3 5-7"/><path d="M15 7h3v3"/>',
  users:   '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4a3 3 0 0 1 0 6M18 14c2 .8 3 3 3 6"/>',
  headset: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  star:    '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  doc:     '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let activeTag = '*';

function renderFilters() {
  const tags = ['*', ...new Set(MENUS.flatMap(m => m.tags || []))];
  document.getElementById('tagFilter').innerHTML = tags.map(x =>
    `<button class="tag-f" aria-pressed="${x === activeTag}" data-t="${esc(x)}">${esc(x === '*' ? t('all') : x)}</button>`).join('');
}

function isDark() { const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function paintTheme() { document.querySelector('#themeBtn span').textContent = isDark() ? t('dark') : t('light'); }
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('gx-theme', next); } catch (e) {} paintTheme();
});
function applyLang() {
  paintTheme();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  const q = document.getElementById('q'); q.placeholder = t('search'); q.setAttribute('aria-label', t('search'));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderFilters(); render();
}
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem('gx-dash-lang', lang); } catch (e) {}
  applyLang();
});

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = MENUS.filter(m =>
    (activeTag === '*' || (m.tags || []).includes(activeTag)) &&
    (!q || (m.name + ' ' + (m.tags || []).join(' ')).toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML = list.length ? list.map(m => {
    const inner = `${m.href ? '' : `<span class="badge">${t('soon')}</span>`}
      <div class="ic"><svg viewBox="0 0 24 24">${ICONS[m.icon] || ICONS.doc}</svg></div>
      <div class="name">${esc(m.name)}</div>
      <div class="tags">${(m.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
    return m.href
      ? `<a class="card" href="${esc(m.href)}"${m.newTab ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`
      : `<div class="card soon" aria-disabled="true" title="${t('soon')}">${inner}</div>`;
  }).join('') : `<div class="empty">${t('empty')}</div>`;
}

document.getElementById('tagFilter').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  activeTag = b.dataset.t; renderFilters(); render();
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('yr').textContent = new Date().getFullYear();
applyLang();
</script>
</body>
</html>
