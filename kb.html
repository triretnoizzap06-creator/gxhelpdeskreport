<style>
:root{--bg:#F5F5F7;--card:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--line:#E5E5EA;--line-h:#F5C518;--chip:#FFF6D1;--chip-ink:#7A5B00;--soft:#FAFAFA;--hd:#0E7490;--hdbg:#CFFAFE;--am:#7C3AED;--ambg:#EDE9FE;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0D;--card:#161618;--ink:#F5F5F7;--muted:#98989D;--line:#2C2C2E;--chip:#3A3115;--chip-ink:#FFD866;--soft:#1C1C1F;--hdbg:#083344;--hd:#67E8F9;--ambg:#2E1065;--am:#C4B5FD;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0D;--card:#161618;--ink:#F5F5F7;--muted:#98989D;--line:#2C2C2E;--chip:#3A3115;--chip-ink:#FFD866;--soft:#1C1C1F;--hdbg:#083344;--hd:#67E8F9;--ambg:#2E1065;--am:#C4B5FD;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{height:24px;display:block}.logo.dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
:root[data-theme="dark"] .logo.lt{display:none}:root[data-theme="dark"] .logo.dk{display:block}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.danger{color:#DC2626}.btn.sm{padding:5px 9px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:30px 20px 60px}
.hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}.hero p{margin:0 0 18px;color:var(--muted);font-size:14px}
.search{width:100%;font-size:15px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none}.search:focus{border-color:var(--line-h)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.chipf{font:600 13px var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar .sp{flex:1}

.ksec-h h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.ksec-h span{font-size:12.5px;color:var(--muted)}.ksec-h .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

mark{background:#FDE68A;color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);font-size:14px;padding:16px 0}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 14px;background:#FEF3C7;color:#92400E}
.md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}

:root[data-theme="dark"] .pill.c-admin{background:#3A2A08;color:#FCD34D}:root[data-theme="dark"] .pill.c-teknis,:root[data-theme="dark"] .pill.done{background:#052E16;color:#86EFAC}

.srcl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.quiz{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px}

.qq{border-top:1px solid var(--line);padding:14px 0}.qq:first-of-type{border-top:0}

.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:14px;color:inherit}
.opt:hover:not([disabled]){border-color:var(--line-h)}.opt .k{font-weight:800;color:var(--muted);min-width:16px}
.opt.sel{border-color:var(--ink)}.opt.ok{border-color:#16A34A;background:#DCFCE7;color:#14532D}.opt.bad{border-color:#DC2626;background:#FEE2E2;color:#7F1D1D}
.opt[disabled]{cursor:default}
.exp{font-size:13px;margin-top:6px;color:var(--muted);line-height:1.5}.exp b{color:var(--ink)}
.qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.score{font-weight:800;font-size:15px}
.nav2{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.qe{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}.qe-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.qe-h .sp{flex:1}

.f label.qo{display:flex;align-items:center;gap:8px;margin:0;font-weight:400;font-size:13.5px;color:var(--ink)}.qo input[type=radio]{flex:none;width:18px!important;height:18px;margin:0 0 6px;padding:0;accent-color:#16A34A}.qo input:not([type=radio]){flex:1}
.f textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.hidden{display:none!important}
/* link & embed di isi materi */
.doc a.ilk{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;border-bottom:2px solid var(--line-h);line-height:1.3}
.doc a.ilk:hover{background:var(--chip)}
.emb{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.emb .ef{position:relative;width:100%;aspect-ratio:16/9;background:var(--soft)}.emb.tall .ef{aspect-ratio:auto;height:560px}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.emb .ec{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--card)}
.emb .ec b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.emb .ec .sp{flex:1}
.emb .ec a{text-decoration:none;color:var(--ink);font-weight:600;white-space:nowrap}
.lcard{display:flex!important;align-items:center;gap:12px;margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none!important;color:inherit!important;background:var(--card)}
.lcard:hover{border-color:var(--line-h)}.lcard .li{flex:none;width:34px;height:34px;border-radius:9px;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;font-size:16px}
.lcard .lt{display:flex;flex-direction:column;min-width:0}.lcard .lt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lcard .lt span{font-size:12px;color:var(--muted)}
/* editor isi materi */
.tb{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.tb .btn{padding:4px 9px;font-size:12px}.tb .sep{width:1px;background:var(--line);margin:0 3px}
.ins{display:none;gap:6px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line-h);border-radius:9px;padding:8px;margin-bottom:6px;background:var(--chip)}.ins.on{display:flex}
.ins input{flex:1 1 180px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;font-size:13px}
.ins .hint{flex-basis:100%;font-size:11.5px;color:var(--chip-ink)}
.pv{border:1px solid var(--line);border-radius:10px;padding:2px 14px 10px;max-height:420px;overflow:auto;background:var(--card)}
.rhead{display:flex;gap:8px;align-items:flex-start}.rhead h1{flex:1}
@media (max-width:600px){.doc{padding:4px 14px 14px}.quiz{padding:14px}.reader h1{font-size:21px}}
</style>

<main>
  <div id="home">
    <div class="hero"><h1>Knowledge Base</h1><p>Materi tim Helpdesk Customer Support & Account Manager — dikelompokkan per Info Helpdesk, Administrasi, Teknis, SDM & Schedule, serta Handling & Kebijakan. Quiz ada di halaman terpisah.</p></div>

<script>
/* Knowledge Base — materi (kb-data.js, hasil crawling Notion) + link referensi Helpdesk/AM.
   Dibaca tim tanpa login. Edit (link, override materi, materi baru) hanya untuk SPV yang sudah login. */
const DOC = 'knowledge-base';
const SECT = [['HD', 'Link Helpdesk', 'Helpdesk Customer Support'], ['AM', 'Link Account Manager', 'Account Manager VIP']];
const A = (title, desc, url, source, tags) => ({ title, desc, url, source, tags });
const KB_DEFAULT = {
  HD: [
    A('SOP Flow Handling Helpdesk', 'Alur penanganan Customer Support. Sudah direvisi mengikuti alur kerja baru di Omnichannel Qiscus (per 25 Mei 2026).', 'https://melon-lime-e28.notion.site/SOP-Flow-Handling-Helpdesk-1d69b0fbceac80b98317da1a66743b16', 'Notion', ['SOP', 'Qiscus']),
    A('Scope Penanganan Helpdesk Customer Support', 'Materi Weekly Meeting Helpdesk — kategori & scope penanganan.', 'https://www.figma.com/make/Q14wKSakut2DPzwoZqt7qf/Scope-Penanganan-Helpdesk-Customer-Support', 'Figma', ['Kategori', 'Weekly Meeting']),
    A('Flow Helpdesk', 'Materi Weekly Meeting SOP Helpdesk.', 'https://www.figma.com/make/4dlhK0WIMX8zgXY3xvseCn/Flow-Helpdesk', 'Figma', ['SOP', 'Weekly Meeting']),
    A('GX CS Connect', 'Portal GX Connect Customer Support.', 'https://gxcsconnect.globalxtreme-solutions.net/', 'Web', ['Tools']),
    A('CSO Workspace', 'Detail observation & AFR (Operations / Helpdesk).', 'https://cso-workspace.vercel.app', 'Web', ['Observation', 'AFR']),
  ],
  AM: [
    A('Flow Account Manager', 'Alur handling VIP Group oleh Account Manager.', 'https://app.notion.com/p/Flow-Account-Manager-2fe9b0fbceac808ba433d9149a7d0a4f', 'Notion', ['SOP', 'VIP']),
    A('Template VIP — Account Manager', 'Template Account Manager (AM) untuk handling VIP Group.', 'https://docs.google.com/document/d/1PMfOf0d9nQtInjhPHSVTWc8u26ZWL8BReIJczwF7SEc/edit', 'Google Docs', ['Template', 'VIP']),
    A('Masterlist VIP Group', 'Data list group VIP GX (update data VIP & Intracity).', 'https://docs.google.com/spreadsheets/d/1LRCBD_d1KjX1HQ4cIyAakXVlkPwQTg8mBv7E5QoMBkU/edit?gid=0#gid=0', 'Google Sheets', ['Data VIP']),
    A('Monitoring VIP Group — Tracking sheet', 'Sheet monitoring group & tracking VIP.', 'https://docs.google.com/spreadsheets/d/1nfn0cazlhz0Vck7vz5WikBnIV9LFTBWZXLfk8Q34xuk/edit?gid=480098290#gid=480098290', 'Google Sheets', ['Monitoring', 'VIP']),
    A('Reminder Bill 25 — VIP & Intracity', 'Sheet update INV VIP setiap tanggal 25 (pembagian per orang ada di materi Pembagian Update INV VIP).', 'https://docs.google.com/spreadsheets/d/19mNgXyeEei_hIwdwS9gfphbzlbPVjdn-/edit?gid=138707526#gid=138707526', 'Google Sheets', ['VIP', 'Tanggal 25']),
    A('Outstanding Bills — Dedicated Package (DIA)', 'Sheet outstanding pelanggan DIA.', 'https://docs.google.com/spreadsheets/d/1p2rNp5duqp8zvWIqDWFznzCkv4TUBXY3E2WJEd_J5U0/edit?usp=sharing', 'Google Sheets', ['DIA', 'Billing']),
    A('PPT VIP & Intracity Group', 'Presentasi daftar group VIP & Intracity.', 'https://throb-invert-82417920.figma.site/', 'Figma', ['VIP', 'Intracity']),
  ],
};
const DEF_CATS = window.KB_CATS || [], BASE = window.KB_MATERI || [];
let CATS = DEF_CATS;
const AM_IDS = ['flow-account-manager', 'masterlist-vip', 'inv-vip-25', 'upgrade-vip', 'tools-akses', 'observation-hd-am', 'bod-dia-intracity', 'sop-grace'];
let CATNAME = Object.fromEntries(CATS.map(c => [c[0], c[1]]));
function applyCats() { CATS = Array.isArray(KB.data.cats) && KB.data.cats.length ? KB.data.cats : DEF_CATS; CATNAME = Object.fromEntries(CATS.map(c => [c[0], c[1]])); }
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const LSVG = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); }
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const HASHF = { '#hd': 'helpdesk', '#am': 'am', '#admin': 'admin', '#teknis': 'teknis', '#umum': 'umum', '#links': 'links', '#helpdesk': 'helpdesk' };
const KB = { data: { ...JSON.parse(JSON.stringify(KB_DEFAULT)), materi: { over: {}, added: [], hidden: [] } }, rev: null, canEdit: false, online: false, edit: false, filter: HASHF[location.hash] || '*', scores: LS.get('gx-kb-scores', {}) };

function materi() {
  const m = KB.data.materi || {}, over = m.over || {}, hid = new Set(m.hidden || []);
  return BASE.map(x => over[x.id] ? { ...x, ...over[x.id], quiz: over[x.id].quiz || x.quiz } : x).concat(m.added || []).filter(x => KB.edit || !hid.has(x.id));
}
async function load() {
  try {
    const r = await fetch('/api/todo?doc=' + DOC, { cache: 'no-store', credentials: 'same-origin' }); const j = await r.json();
    KB.online = true; KB.canEdit = !!j.canEdit;
    if (r.status === 200 && j.data && j.data.HD) { KB.data = { materi: { over: {}, added: [], hidden: [] }, ...j.data }; KB.rev = j.revision; }
  } catch (e) { KB.online = false; KB.canEdit = true; $('#banner').innerHTML = '<div class="banner"><b>Mode preview</b> — server belum tersambung; perubahan tidak tersimpan.</div>'; }
  applyCats();
  $('#edBtn').style.display = KB.canEdit ? '' : 'none';
  $('#loginBtn').style.display = KB.online && !KB.canEdit ? '' : 'none';
  route();
}
function hl(s, q) { const e = esc(s); if (!q) return e; const i = e.toLowerCase().indexOf(esc(q).toLowerCase()); return i < 0 ? e : e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length); }

  drawQ();
  /* toolbar isi materi */
  const ta = el.querySelector('[data-f="body"]'), insRow = el.querySelector('[data-ins-row]'), pvBox = el.querySelector('[data-pvbox]');
  let insMode = 'link';
  const putAt = (txt, block) => {
    const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
    let pre = v.slice(0, a), post = v.slice(b);
    if (block) { if (pre && !pre.endsWith('\n')) txt = '\n' + txt; if (!post.startsWith('\n')) txt += '\n'; }
    ta.value = pre + txt + post; ta.focus(); const c = (pre + txt).length; ta.setSelectionRange(c, c); refreshPv();
  };
  const lineFmt = pfx => {
    const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value, s0 = v.lastIndexOf('\n', a - 1) + 1, e0 = v.indexOf('\n', b) < 0 ? v.length : v.indexOf('\n', b);
    const lines = v.slice(s0, e0).split('\n').map((l, i) => (typeof pfx === 'function' ? pfx(i) : pfx) + l.replace(/^(##\s+|-\s+|\d+\.\s+|>\s?)/, ''));
    ta.value = v.slice(0, s0) + lines.join('\n') + v.slice(e0); ta.focus(); refreshPv();
  };
  const refreshPv = () => { if (!pvBox.classList.contains('hidden')) pvBox.innerHTML = `<div class="doc" style="border:0;padding:0">${md(ta.value)}</div>`; };
  ta.addEventListener('input', refreshPv);
  el.addEventListener('click', e => {
    const f = e.target.closest('[data-fmt]');
    if (f) { const k = f.dataset.fmt;
      if (k === 'b') { const a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b) || 'teks tebal'; putAt('**' + sel + '**'); }
      else lineFmt({ h: '## ', ul: '- ', ol: i => (i + 1) + '. ', note: '> ' }[k]);
      return; }
    const io = e.target.closest('[data-ins-open]');
    if (io) { insMode = io.dataset.insOpen; insRow.classList.add('on');
      const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
      insRow.querySelector('[data-ins="text"]').value = sel; insRow.querySelector('[data-ins="text"]').placeholder = insMode === 'embed' ? 'Judul (opsional)' : 'Teks link (mis. Template VIP)';
      insRow.querySelector('[data-ins-hint]').textContent = insMode === 'embed' ? 'Embed tampil langsung untuk Google Docs/Sheets/Slides/Forms/Drive, YouTube, Loom, Figma & Canva (pastikan akses share "Anyone with the link"). Link lain tampil sebagai kartu link.' : 'Teks akan tampil sebagai link yang bisa diklik.';
      insRow.querySelector('[data-ins="url"]').focus(); return; }
    if (e.target.closest('[data-ins-x]')) { insRow.classList.remove('on'); return; }
    if (e.target.closest('[data-ins-go]')) {
      const t = insRow.querySelector('[data-ins="text"]').value.trim().replace(/[\[\]|]/g, ''), u = safeUrl(insRow.querySelector('[data-ins="url"]').value);
      if (!u) return alert('Link harus diawali https://');
      if (insMode === 'embed') putAt('@embed ' + u + (t ? ' | ' + t : ''), true); else putAt(t ? `[${t}](${u})` : u);
      insRow.classList.remove('on'); insRow.querySelectorAll('input').forEach(i => { i.value = ''; }); return; }
    const pv = e.target.closest('[data-pv]');
    if (pv) { const on = pvBox.classList.toggle('hidden'); pv.textContent = on ? '👁 Preview' : '✎ Tutup preview'; refreshPv(); return; }
    if (e.target.closest('[data-qadd]')) { sync(); quiz.push({ q: '', o: ['', '', '', ''], a: 0, e: '' }); drawQ(); el.querySelector('.qe:last-child textarea').focus(); return; }
    const qd = e.target.closest('[data-qdel]'); if (qd) { sync(); quiz.splice(+qd.closest('.qe').dataset.qi, 1); drawQ(); return; }
    const b = e.target.closest('[data-act]'); if (e.target === el) return el.remove(); if (!b) return;
    const act = b.dataset.act; if (act === 'x') return el.remove();
    if (act === 'hide') { if (!confirm('Hapus materi ini? Materi pindah ke bagian "Materi dihapus" (bisa dipulihkan).')) return; M.hidden = [...new Set([...(M.hidden || []), id])]; }
    else if (act === 'reset') { if (!confirm('Kembalikan materi & soal ke versi asli?')) return; delete M.over[id]; }
    else {
      const g = f => el.querySelector(`[data-f="${f}"]`).value.trim();
      if (!g('title')) return alert('Judul wajib diisi.');
      if (g('src') && !safeUrl(g('src'))) return alert('Link harus diawali https://');
      const Q = [];
      for (const [i, x] of readQ().entries()) {
        if (!x.q && !x.o4.some(Boolean)) continue;   // soal kosong diabaikan
        const opts = x.o4.map((v, j) => ({ v, j })).filter(o => o.v);
        if (!x.q || opts.length < 2) return alert(`Soal ${i + 1}: isi pertanyaan dan minimal 2 opsi.`);
        const a = opts.findIndex(o => o.j === x.a); if (a < 0) return alert(`Soal ${i + 1}: pilih jawaban yang benar (bulatan di opsi yang sudah diisi).`);
        Q.push({ q: x.q, o: opts.map(o => o.v), a, e: x.e });
      }
      const nx = { title: g('title'), cat: g('cat'), summary: g('summary'), body: el.querySelector('[data-f="body"]').value, src: g('src'), quiz: Q };
      if (isBase) M.over[id] = nx;
      else if (id) Object.assign(M.added.find(m => m.id === id), nx);
      else M.added.push({ id: 'c-' + Date.now().toString(36), ...nx });
    }
    el.remove(); route(); save();
  });
}
function loginModal() {
  const el = document.createElement('div'); el.className = 'md';
  el.innerHTML = `<div class="mdb" style="max-width:420px"><h3>Login SPV</h3><p style="font-size:13px;color:var(--muted);margin:0 0 12px">Pakai password dashboard (yang sama dengan Helpdesk Management).</p>
    <form method="post" action="/api/login"><input type="hidden" name="next" value="${esc(location.pathname + location.hash)}"><div class="f"><input type="password" name="password" placeholder="Password" autofocus required></div>
    <div class="mfoot"><span class="sp"></span><button type="button" class="btn" data-act="x">Batal</button><button class="btn pri">Login</button></div></form></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-act="x"]')) el.remove(); });
}
function catEdit(kind, k) {
  let C = JSON.parse(JSON.stringify(CATS));
  if (kind === 'add') { const n = prompt('Nama kategori baru:'); if (!n || !n.trim()) return; const d = prompt('Deskripsi singkat (opsional):', '') || ''; C.push(['k-' + Date.now().toString(36), n.trim(), d.trim()]); }
  else if (kind === 'ren') { const c = C.find(x => x[0] === k); const n = prompt('Nama kategori:', c[1]); if (n == null || !n.trim()) return; const d = prompt('Deskripsi:', c[2] || ''); c[1] = n.trim(); if (d != null) c[2] = d.trim(); }
  else if (kind === 'del') {
    const used = materi().filter(x => x.cat === k && !(KB.data.materi.hidden || []).includes(x.id)).length;
    if (used) return alert(`Kategori ini masih punya ${used} materi. Pindahkan (Edit → Kategori) atau hapus materinya dulu.`);
    if (!confirm('Hapus kategori ini?')) return; C = C.filter(x => x[0] !== k);
  }
  KB.data.cats = C; applyCats(); if (KB.filter === k) KB.filter = '*'; renderHome(); save();
}
/* ---------- events ---------- */
$('#q').addEventListener('input', renderHome);
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { KB.filter = b.dataset.f; history.replaceState(null, '', b.dataset.f === '*' ? location.pathname : '#' + (b.dataset.f === 'helpdesk' ? 'hd' : b.dataset.f)); renderHome(); } });
$('#edBtn').onclick = () => { KB.edit = !KB.edit; renderHome(); };
$('#loginBtn').onclick = loginModal;
document.addEventListener('click', e => {
  if (e.target.closest('[data-cadd]')) return catEdit('add');
  const cr = e.target.closest('[data-cren]'); if (cr) return catEdit('ren', cr.dataset.cren);
  const cd = e.target.closest('[data-cdel]'); if (cd) return catEdit('del', cd.dataset.cdel);
  const mr = e.target.closest('[data-mrestore]'); if (mr) { KB.data.materi.hidden = (KB.data.materi.hidden || []).filter(x => x !== mr.dataset.mrestore); renderHome(); save(); return; }
  const mp = e.target.closest('[data-mpurge]'); if (mp) { if (!confirm('Hapus permanen materi ini?')) return; KB.data.materi.added = KB.data.materi.added.filter(m => m.id !== mp.dataset.mpurge); KB.data.materi.hidden = KB.data.materi.hidden.filter(x => x !== mp.dataset.mpurge); renderHome(); save(); return; }
  const me = e.target.closest('[data-medit]'); if (me) { e.preventDefault(); e.stopPropagation(); return materiModal(me.dataset.medit); }
  if (e.target.closest('[data-login]')) return loginModal();
  const ma = e.target.closest('[data-madd]'); if (ma) return materiModal(null, ma.dataset.madd);
  const ed = e.target.closest('[data-edit]'); if (ed) { e.preventDefault(); const [k, i] = ed.dataset.edit.split('.'); return linkModal(k, +i); }
  const ad = e.target.closest('[data-add]'); if (ad) return linkModal(ad.dataset.add, null);
  const op = e.target.closest('[data-open]'); if (op) { location.hash = 'm/' + encodeURIComponent(op.dataset.open); return; }
  if (e.target.closest('[data-back]')) { location.hash = KB.filter === '*' ? '' : (KB.filter === 'helpdesk' ? 'hd' : KB.filter); return; }
  const o = e.target.closest('.opt[data-q]'); if (o && QZ && !QZ.done) { QZ.ans[+o.dataset.q] = +o.dataset.o; renderQuiz(); return; }
  if (e.target.closest('[data-check]') && QZ) {
    const x = materi().find(m => m.id === QZ.id), n = x.quiz.length;
    if (Object.keys(QZ.ans).length < n && !confirm('Masih ada soal yang belum dijawab. Cek sekarang?')) return;
    QZ.done = true; const right = x.quiz.filter((q, i) => QZ.ans[i] === q.a).length;
    const prev = KB.scores[x.id]; KB.scores[x.id] = { best: Math.max(right, prev ? prev.best : 0), n, last: right }; LS.set('gx-kb-scores', KB.scores);
    renderQuiz(); return;
  }
  if (e.target.closest('[data-retry]') && QZ) { QZ.ans = {}; QZ.done = false; renderQuiz(); }
});
window.addEventListener('hashchange', () => { const f = HASHF[location.hash]; if (f) KB.filter = f; else if (!location.hash) KB.filter = KB.filter; route(); });
load();
</script>
