<style>

.rv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}

.rv .o.ok{background:var(--okbg);color:#14532D;font-weight:700}.rv .o.bad{background:var(--badbg);color:#7F1D1D;text-decoration:line-through}

.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 14px;background:#FEF3C7;color:#92400E}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
.hidden{display:none!important}
body.embed .top{display:none}body.embed main{padding-top:14px}
.lock{max-width:440px;margin:30px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 22px}
.lock .ic{font-size:40px}.lock h1{margin:8px 0 6px}.lock form{display:flex;gap:8px;margin-top:16px}.lock input{flex:1;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;outline:none}.lock input:focus{border-color:var(--y)}
.appr{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
.apr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}.apr:first-of-type{border-top:0}
.apr b{font-size:14.5px}.apr span.s{font-size:12px;color:var(--muted);display:block}.apr .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill.pending{background:#FEF3C7;color:#92400E}.pill.approved{background:#DBEAFE;color:#1E40AF}.pill.done{background:var(--okbg);color:var(--ok)}.pill.rejected{background:var(--badbg);color:var(--bad)}
.lbr.click{cursor:pointer}.lbr.click:hover{background:var(--bg);border-radius:10px}
.wait{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 18px}
.wait .dot{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;border:5px solid var(--line);border-top-color:var(--y);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:grid;place-items:center;padding:14px}
.h2d>summary{cursor:pointer;list-style:none}.h2d>summary::-webkit-details-marker{display:none}.h2d>summary::after{content:" ▾";color:var(--muted)}
.bkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bkbar select,.bkbar input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;background:#fff}.bkbar input{min-width:180px}
.bkl{display:flex;flex-direction:column;gap:12px;max-height:560px;overflow:auto}.bkm{border:1px solid var(--line);border-radius:12px;overflow:hidden}.bkh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);padding:9px 12px}.bkh span{font-size:12px;color:var(--muted)}
.bkq{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}.bkq .n{flex:none;width:22px;color:var(--muted);font-weight:700}.bkq>div{flex:1;min-width:0}.bkq small{color:#15803D;font-size:12px}
.bkfoot{font-size:12px;color:var(--muted);margin-top:10px}.fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}
.box textarea,.box input:not([type=radio]),.box select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px;background:#fff;box-sizing:border-box}
.qmo{display:flex;gap:8px;align-items:center;margin:5px 0}.qmo input[type=radio]{flex:none;width:18px;height:18px;accent-color:#16A34A}
.modal .box{background:var(--bg);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}
@media (max-width:760px){.host{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.tile{min-height:64px;padding:14px}.qbox{padding:20px 14px;min-height:90px}main{padding:18px 14px 50px}.top{padding:10px 14px}}
/* podium */
.podium{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,#FFF9E6,#FFFFFF);border:1px solid #F3E2A9;padding:14px 10px 0;margin:6px 0 14px}
.pd-ttl{text-align:center;font-weight:800;font-size:14px;letter-spacing:.04em;color:#7A5B00;margin-bottom:24px}
.pd-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-top:8px}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}.pd.empty{visibility:hidden}
.pd-av{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:#8E8E93;box-shadow:0 6px 16px rgba(0,0,0,.12);animation:pdpop .5s cubic-bezier(.2,1.4,.4,1) both}
.p1 .pd-av{width:64px;height:64px;background:linear-gradient(135deg,#F5C518,#E09A00);font-size:18px}.p2 .pd-av{background:linear-gradient(135deg,#C7CBD1,#8E949C)}.p3 .pd-av{background:linear-gradient(135deg,#E3A06B,#B8692F)}
.pd-av i{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:20px}.pd-cr{position:absolute;top:-22px;font-size:22px;animation:pdcr 1.6s ease-in-out infinite}
.pd-nm{font-weight:700;font-size:13.5px;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd-sc{font-weight:800;font-size:15px}.pd-sc small{font-weight:600;color:var(--muted);font-size:11px}
.pd-st{width:100%;margin-top:6px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:#fff;transform-origin:bottom;animation:pdgrow .8s cubic-bezier(.2,.9,.3,1) both}
.pd-st span{font-size:26px;font-weight:900;line-height:1}.pd-st small{font-size:10.5px;opacity:.9;margin-top:4px}
.p1 .pd-st{height:118px;background:linear-gradient(180deg,#F5C518,#D99A00);animation-delay:.35s}.p2 .pd-st{height:86px;background:linear-gradient(180deg,#B9BEC6,#8A9099);animation-delay:.15s}.p3 .pd-st{height:64px;background:linear-gradient(180deg,#D99560,#A75E28);animation-delay:.5s}
.pd.me .pd-nm{color:#0A84FF}.pd.me .pd-av{outline:3px solid #0A84FF;outline-offset:2px}
.pd-conf{position:absolute;inset:0;pointer-events:none}.pd-conf i{position:absolute;top:-12px;left:var(--x);width:7px;height:12px;background:var(--c);border-radius:2px;transform:rotate(var(--r));animation:pdfall 2.6s ease-in var(--d) both}
@keyframes pdgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pdpop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes pdcr{50%{transform:translateY(-4px) rotate(-8deg)}}
@keyframes pdfall{0%{transform:translateY(0) rotate(var(--r));opacity:1}100%{transform:translateY(340px) rotate(calc(var(--r) + 540deg));opacity:0}}
.podium.big{padding:24px 18px 0;max-width:720px;margin:0 auto}.podium.big .pd-ttl{font-size:22px;margin-bottom:44px}.podium.big .pd-av{width:84px;height:84px;font-size:22px}.podium.big .p1 .pd-av{width:104px;height:104px;font-size:28px}
.podium.big .pd-nm{font-size:19px}.podium.big .pd-sc{font-size:22px}.podium.big .p1 .pd-st{height:220px}.podium.big .p2 .pd-st{height:160px}.podium.big .p3 .pd-st{height:118px}.podium.big .pd-st span{font-size:44px}.podium.big .pd-cr{font-size:34px;top:-34px}
.pdm .pdm-in{position:relative;width:min(900px,96vw);background:var(--card,#fff);border-radius:22px;padding:28px 18px 22px}.pdm-t{text-align:center;font-weight:800;font-size:15px;color:var(--muted);margin-bottom:8px}
.pdm-rest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;font-size:14px}.pdm-rest span{background:var(--soft,#F5F5F7);border-radius:999px;padding:5px 12px}
@media (prefers-reduced-motion:reduce){.pd-st,.pd-av,.pd-cr,.pd-conf i{animation:none!important}.pd-conf{display:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .podium{background:linear-gradient(180deg,#2A2310,#161618);border-color:#4A3D14}:root:not([data-theme="light"]) .pd-ttl{color:#FFD866}}
:root[data-theme="dark"] .podium{background:linear-gradient(180deg,#2A2310,#161618);border-color:#4A3D14}:root[data-theme="dark"] .pd-ttl{color:#FFD866}
</style>

<script>
/* Quiz Knowledge Base — terpisah dari materi. Mode:

   • Live quiz ala Kahoot: SPV membuat sesi → tim scan QR / masukkan PIN di HP → timer per soal → leaderboard → review jawaban

const $ = s => document.querySelector(s), app = $('#app');

let CATS = window.KB_CATS || [], BASE = window.KB_MATERI || [];
let SETS = [], SETNAME = {};
const setSets = () => { SETS = [...CATS.map(c => [c[0], c[1]]), ['all', 'Semua materi']]; SETNAME = Object.fromEntries(SETS); };
setSets();
let MAT = BASE;   // materi setelah edit SPV (override, tambahan, hapus) dari Knowledge Base
const SHAPES = ['<svg viewBox="0 0 24 24"><path d="M12 3 22 20H2z"/></svg>', '<svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></svg>', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>', '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtS = ms => (ms / 1000).toFixed(1) + ' dtk';
let HIDDEN = new Set(), IS_SPV = false, ONLINE = true;

/* ---------- soal per set (dari kb-data.js; materi yang dihapus SPV ikut tidak dipakai) ---------- */
function questions(set) {
  return MAT.filter(m => !HIDDEN.has(m.id) && (set === 'all' || m.cat === set)).flatMap(m => (m.quiz || []).map(q => ({ ...q, src: m.title })));
}
function prepare(list, n) {   // acak soal & urutan opsi
  return shuffle(list).slice(0, n || list.length).map(q => { const p = shuffle([...q.o.keys()]); return { q: q.q, o: p.map(i => q.o[i]), a: p.indexOf(q.a), e: q.e, src: q.src }; });

/* ---------- API (+ mode preview tanpa server: disimpan di browser ini) ---------- */
async function call(path, opt = {}) {
  try { const r = await fetch('/api/quiz' + path, { cache: 'no-store', credentials: 'same-origin', ...opt, headers: opt.body ? { 'content-type': 'application/json' } : {} }); const j = await r.json(); return { status: r.status, j }; }

const LOCAL = {
  all: () => LS.get('gx-quiz-local', {}), save: d => LS.set('gx-quiz-local', d),
  create(c) { const d = this.all(), code = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''); d[code] = { ...c, code, status: 'open', created_at: new Date().toISOString(), results: [] }; this.save(d); return code; },
  get(code) { return this.all()[code]; },

const API = {
  async session(code) { const r = await call('?code=' + code); if (r) { ONLINE = true; return r.status === 200 ? r.j.session : null; } ONLINE = false; const s = LOCAL.get(code); return s ? { ...s, n: s.questions.length, questions: s.questions.map(x => ({ q: x.q, o: x.o })) } : null; },
  async board(code) { const r = await call('?code=' + code + '&board=1'); if (r) return r.j.board || []; const s = LOCAL.get(code); return s ? s.results.slice().sort((a, b) => b.score - a.score || a.duration_ms - b.duration_ms) : []; },
  async submit(code, player, answers, token) {
    const r = await call('', { method: 'POST', body: JSON.stringify({ code, player, token, answers }) }); if (r) return r;
    const d = LOCAL.all(), s = d[code]; if (!s) return { status: 404, j: { error: 'not-found' } };
    if (s.results.some(x => x.player.toLowerCase() === player.toLowerCase())) return { status: 409, j: { error: 'name-taken', detail: 'Nama ini sudah dipakai di sesi ini — pakai nama lain.' } };
    const ans = s.questions.map((x, i) => { const a = answers[i] || {}; const ms = Math.min(s.timer_s * 1000, a.ms || s.timer_s * 1000); return { c: a.c ?? null, ms, p: pts(a.c === x.a, ms, s.timer_s) }; });
    const row = { player, score: ans.reduce((t, a) => t + a.p, 0), correct: ans.filter((a, i) => a.c === s.questions[i].a).length, total: s.questions.length, duration_ms: ans.reduce((t, a) => t + a.ms, 0), answers: ans, created_at: new Date().toISOString() };
    s.results.push(row); const jp = (s.joins || {})[player.toLowerCase()]; if (jp) jp.status = 'done'; LOCAL.save(d); const B = await this.board(code);
    return { status: 200, j: { result: row, rank: B.findIndex(x => x.player === player) + 1, players: B.length, review: s.questions.map((x, i) => ({ ...x, ...ans[i] })) } };
  },
  async join(code, player, token) {
    const r = await call('', { method: 'POST', body: JSON.stringify({ join: { code, player, token } }) }); if (r) return r;
    const d = LOCAL.all(), s = d[code]; if (!s) return { status: 404, j: { error: 'not-found' } }; s.joins = s.joins || {};

  },
  async me(code, token) {

    return { status: 200, j: { status: p.status, player: p.name, session: p.status === 'approved' ? { ...s, questions: s.questions.map(x => ({ q: x.q, o: x.o })) } : { ...s, questions: undefined, n: s.questions.length } } };

  async joins(code) { const r = await call('?code=' + code + '&joins=1'); if (r) return r; const s = LOCAL.get(code); return { status: 200, j: { players: Object.values((s && s.joins) || {}) } }; },
  async decide(code, player, act) {

  async refresh(code, qs) { const r = await call('', { method: 'POST', body: JSON.stringify({ refresh: { code, questions: qs } }) }); if (r) return r; const d = LOCAL.all(); if (d[code] && !d[code].results.length) { d[code].questions = qs; LOCAL.save(d); return { status: 200, j: { ok: true } }; } return { status: 409, j: { detail: 'Sudah ada peserta yang mengerjakan.' } }; },
  async create(c) { const r = await call('', { method: 'POST', body: JSON.stringify({ create: c }) }); if (r) return r; return { status: 200, j: { code: LOCAL.create(c) } }; },
  async list() { const r = await call('?list=1'); if (r) return r; const d = LOCAL.all(); return { status: 200, j: { sessions: Object.values(d).reverse().map(s => ({ ...s, n: s.questions.length, players: s.results.length })) } }; },

    const qq = el.querySelector('#qmQ').value.trim(), opts = [...el.querySelectorAll('[data-o]')].map(i => ({ v: i.value.trim(), j: +i.dataset.o })).filter(x => x.v), aj = +((el.querySelector('[name=qmA]:checked') || {}).value ?? -1), a = opts.findIndex(x => x.j === aj);
    if (!qq || opts.length < 2) return toast('Isi pertanyaan & minimal 2 opsi'); if (a < 0) return toast('Pilih jawaban yang benar (bulatan di opsi yang terisi)');
    const nq = { q: qq, o: opts.map(x => x.v), a, e: el.querySelector('#qmE').value.trim() }, id = mid || ms.value;
    const ok = await saveBank(MM => { const h = quizOf(MM, id), Q = h.get(); if (idx != null) Q[idx] = nq; else Q.push(nq); h.set(Q);
      if (id.startsWith('n-')) { const p = QB.npages[id.slice(2)] || {}; MM.over[id] = { ...MM.over[id], title: MM.over[id].title || p.t || 'Materi Notion', cat: MM.over[id].cat || (el.querySelector('#qmCat') || {}).value || QB.set } } });
    if (ok) el.remove(); };
}
document.addEventListener('click', async e => {
  if (!$('#bank')) return;
  if (e.target.id === 'bkRef') { e.target.disabled = true; await loadBank(); await loadNotionTitles(); drawBank(); toast('Soal terbaru dimuat ✓'); return; }
  if (e.target.id === 'bkNew') { await loadNotionTitles(); return qModal(null, null); }
  const a = e.target.closest('[data-bkadd]'); if (a) return qModal(a.dataset.bkadd, null);
  const ed = e.target.closest('[data-bked]'); if (ed) { const [id, i] = ed.dataset.bked.split('|'); return qModal(id, +i); }
  const dl = e.target.closest('[data-bkdel]'); if (dl) { const [id, i] = dl.dataset.bkdel.split('|'), m = MAT.find(x => x.id === id); if (!confirm('Hapus soal ini?\n\n' + ((m && m.quiz[+i] || {}).q || ''))) return;
    return saveBank(MM => { const h = quizOf(MM, id), Q = h.get(); Q.splice(+i, 1); h.set(Q); }); }
});
document.addEventListener('change', e => { if (e.target.id === 'bkSet') { QB.set = e.target.value; drawBank(); } });
document.addEventListener('input', e => { if (e.target.id === 'bkQ') { QB.q = e.target.value; const l = $('#bank .bkl'); if (l) l.innerHTML = bankHtml(); } });
addEventListener('popstate', route);
(async () => {
  try { const r = await fetch('/api/todo?doc=knowledge-base', { cache: 'no-store', credentials: 'same-origin' }); await r.json(); await loadBank(); }
  catch (e) { ONLINE = false; IS_SPV = true; app.insertAdjacentHTML('beforebegin', '<div style="max-width:1100px;margin:16px auto 0;padding:0 18px"><div class="banner" style="margin:0"><b>Mode preview</b> — server belum tersambung; sesi & leaderboard hanya tersimpan di browser ini.</div></div>'); }
  route();
})();
