<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quiz · GX CS Knowledge Base</title>
<link rel="icon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--muted:#6E6E73;--line:#E5E5EA;--y:#F5C518;--ok:#16A34A;--okbg:#DCFCE7;--bad:#DC2626;--badbg:#FEE2E2;
  --k1:#E21B3C;--k2:#1368CE;--k3:#C88A00;--k4:#26890C;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top img{height:22px;display:block}.top .sp{flex:1}.top b{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.y{background:var(--y);border-color:var(--y);color:#111}.btn.sm{padding:6px 10px;font-size:12.5px}.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
main{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}.lead{color:var(--muted);margin:0 0 20px;font-size:14.5px}
.h2{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--y)}
.join{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.join input{flex:1;min-width:180px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:20px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;text-align:center;outline:none}.join input:focus{border-color:var(--y)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.set{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.set b{font-size:16px}.set span{font-size:13px;color:var(--muted)}.set .row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.set.admin{border-top:5px solid #C88A00}.set.sdm{border-top:5px solid #DB2777}.set.teknis{border-top:5px solid #16A34A}.set.helpdesk{border-top:5px solid #0E7490}.set.umum{border-top:5px solid #7C3AED}.set.all{border-top:5px solid var(--ink)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.fg label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fg select,.fg input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--line);color:var(--muted)}.pill.open{background:var(--okbg);color:var(--ok)}
/* host */
.host{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.pin{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.pin small{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.pin .code{font-family:Montserrat,var(--font);font-size:clamp(40px,6vw,64px);font-weight:900;letter-spacing:.12em;margin:6px 0 10px}
.qr{display:flex;justify-content:center;margin:10px auto 12px;min-height:220px}.qr img,.qr canvas{border-radius:10px}
.url{font-size:12.5px;color:var(--muted);word-break:break-all}
.lb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.lbr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}.lbr:first-of-type{border-top:0}
.lbr .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--bg);font-size:13px}
.lbr:nth-of-type(1) .rk{background:#FDE68A}.lbr:nth-of-type(2) .rk{background:#E5E7EB}.lbr:nth-of-type(3) .rk{background:#FED7AA}
.lbr b{font-size:14.5px}.lbr span{font-size:12px;color:var(--muted);display:block}.lbr .sc{font-weight:900;font-size:17px}
.lbr.me{background:#FFF8DB;border-radius:10px}
/* play */
.play{max-width:900px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-weight:800;font-size:14px}.qhead .sp{flex:1}
.timer{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}.timer i{display:block;height:100%;background:var(--y);width:100%}
.qbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;font-size:clamp(18px,2.6vw,26px);font-weight:800;line-height:1.3;margin-bottom:14px;min-height:120px;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:14px;border:0;border-radius:14px;padding:18px 16px;min-height:84px;color:#fff;font-size:clamp(14px,1.8vw,18px);font-weight:800;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s,opacity .2s}
.tile:active{transform:translateY(2px)}.tile .sh{flex:none;width:30px;height:30px;display:grid;place-items:center}.tile .sh svg{width:28px;height:28px;fill:#fff}
.tile.t0{background:var(--k1)}.tile.t1{background:var(--k2)}.tile.t2{background:var(--k3)}.tile.t3{background:var(--k4)}
.tile.dim{opacity:.28}.tile.right{outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}.tile.pick{outline:4px solid #fff;box-shadow:0 0 0 7px var(--ink)}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb.ok{background:var(--okbg);color:#14532D}.fb.bad{background:var(--badbg);color:#7F1D1D}.fb.lock{background:#EEF2FF;color:#312E81}
.fb p{margin:0;width:100%;font-weight:500;font-size:13.5px;color:inherit;opacity:.9}.fb .sp{flex:1}
.res{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 18px;margin-bottom:16px}
.res .big{font-family:Montserrat,var(--font);font-size:clamp(40px,7vw,64px);font-weight:900;line-height:1}
.res .kp{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:14px}.res .kp b{display:block;font-size:22px}.res .kp span{font-size:12px;color:var(--muted)}
.rv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.rv .qt{font-weight:800;margin-bottom:8px;font-size:14.5px}.rv .o{font-size:13.5px;padding:6px 10px;border-radius:8px;margin:4px 0;background:var(--bg)}
.rv .o.ok{background:var(--okbg);color:#14532D;font-weight:700}.rv .o.bad{background:var(--badbg);color:#7F1D1D;text-decoration:line-through}
.rv .ex{font-size:13px;color:var(--muted);margin-top:6px}.rv .pts{float:right;font-weight:800;font-size:13px}
.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:14px}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 14px;background:#FEF3C7;color:#92400E}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
.hidden{display:none!important}
body.embed .top{display:none}body.embed main{padding-top:14px}
.lock{max-width:440px;margin:30px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 22px}
.lock .ic{font-size:40px}.lock h1{margin:8px 0 6px}.lock form{display:flex;gap:8px;margin-top:16px}.lock input{flex:1;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;outline:none}.lock input:focus{border-color:var(--y)}
.appr{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
.apr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}.apr:first-of-type{border-top:0}
.apr b{font-size:14.5px}.apr span.s{font-size:12px;color:var(--muted);display:block}.apr .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill.pending{background:#FEF3C7;color:#92400E}.pill.approved{background:#DBEAFE;color:#1E40AF}.pill.done{background:var(--okbg);color:var(--ok)}.pill.rejected{background:var(--badbg);color:var(--bad)}
.lbr.click{cursor:pointer}.lbr.click:hover{background:var(--bg);border-radius:10px}
.wait{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 18px}
.wait .dot{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;border:5px solid var(--line);border-top-color:var(--y);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:grid;place-items:center;padding:14px}
.h2d>summary{cursor:pointer;list-style:none}.h2d>summary::-webkit-details-marker{display:none}.h2d>summary::after{content:" ▾";color:var(--muted)}
.bkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bkbar select,.bkbar input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;background:#fff}.bkbar input{min-width:180px}
.bkl{display:flex;flex-direction:column;gap:12px;max-height:560px;overflow:auto}.bkm{border:1px solid var(--line);border-radius:12px;overflow:hidden}.bkh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);padding:9px 12px}.bkh span{font-size:12px;color:var(--muted)}
.bkq{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}.bkq .n{flex:none;width:22px;color:var(--muted);font-weight:700}.bkq>div{flex:1;min-width:0}.bkq small{color:#15803D;font-size:12px}
.bkfoot{font-size:12px;color:var(--muted);margin-top:10px}.fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}
.box textarea,.box input:not([type=radio]),.box select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px;background:#fff;box-sizing:border-box}
.qmo{display:flex;gap:8px;align-items:center;margin:5px 0}.qmo input[type=radio]{flex:none;width:18px;height:18px;accent-color:#16A34A}
.modal .box{background:var(--bg);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}
@media (max-width:760px){.host{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.tile{min-height:64px;padding:14px}.qbox{padding:20px 14px;min-height:90px}main{padding:18px 14px 50px}.top{padding:10px 14px}}
/* podium */
.podium{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,#FFF9E6,#FFFFFF);border:1px solid #F3E2A9;padding:14px 10px 0;margin:6px 0 14px}
.pd-ttl{text-align:center;font-weight:800;font-size:14px;letter-spacing:.04em;color:#7A5B00;margin-bottom:24px}
.pd-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-top:8px}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}.pd.empty{visibility:hidden}
.pd-av{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:#8E8E93;box-shadow:0 6px 16px rgba(0,0,0,.12);animation:pdpop .5s cubic-bezier(.2,1.4,.4,1) both}
.p1 .pd-av{width:64px;height:64px;background:linear-gradient(135deg,#F5C518,#E09A00);font-size:18px}.p2 .pd-av{background:linear-gradient(135deg,#C7CBD1,#8E949C)}.p3 .pd-av{background:linear-gradient(135deg,#E3A06B,#B8692F)}
.pd-av i{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:20px}.pd-cr{position:absolute;top:-22px;font-size:22px;animation:pdcr 1.6s ease-in-out infinite}
.pd-nm{font-weight:700;font-size:13.5px;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd-sc{font-weight:800;font-size:15px}.pd-sc small{font-weight:600;color:var(--muted);font-size:11px}
.pd-st{width:100%;margin-top:6px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:#fff;transform-origin:bottom;animation:pdgrow .8s cubic-bezier(.2,.9,.3,1) both}
.pd-st span{font-size:26px;font-weight:900;line-height:1}.pd-st small{font-size:10.5px;opacity:.9;margin-top:4px}
.p1 .pd-st{height:118px;background:linear-gradient(180deg,#F5C518,#D99A00);animation-delay:.35s}.p2 .pd-st{height:86px;background:linear-gradient(180deg,#B9BEC6,#8A9099);animation-delay:.15s}.p3 .pd-st{height:64px;background:linear-gradient(180deg,#D99560,#A75E28);animation-delay:.5s}
.pd.me .pd-nm{color:#0A84FF}.pd.me .pd-av{outline:3px solid #0A84FF;outline-offset:2px}
.pd-conf{position:absolute;inset:0;pointer-events:none}.pd-conf i{position:absolute;top:-12px;left:var(--x);width:7px;height:12px;background:var(--c);border-radius:2px;transform:rotate(var(--r));animation:pdfall 2.6s ease-in var(--d) both}
@keyframes pdgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pdpop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes pdcr{50%{transform:translateY(-4px) rotate(-8deg)}}
@keyframes pdfall{0%{transform:translateY(0) rotate(var(--r));opacity:1}100%{transform:translateY(340px) rotate(calc(var(--r) + 540deg));opacity:0}}
.podium.big{padding:24px 18px 0;max-width:720px;margin:0 auto}.podium.big .pd-ttl{font-size:22px;margin-bottom:44px}.podium.big .pd-av{width:84px;height:84px;font-size:22px}.podium.big .p1 .pd-av{width:104px;height:104px;font-size:28px}
.podium.big .pd-nm{font-size:19px}.podium.big .pd-sc{font-size:22px}.podium.big .p1 .pd-st{height:220px}.podium.big .p2 .pd-st{height:160px}.podium.big .p3 .pd-st{height:118px}.podium.big .pd-st span{font-size:44px}.podium.big .pd-cr{font-size:34px;top:-34px}
.pdm .pdm-in{position:relative;width:min(900px,96vw);background:var(--card,#fff);border-radius:22px;padding:28px 18px 22px}.pdm-t{text-align:center;font-weight:800;font-size:15px;color:var(--muted);margin-bottom:8px}
.pdm-rest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;font-size:14px}.pdm-rest span{background:var(--soft,#F5F5F7);border-radius:999px;padding:5px 12px}
@media (prefers-reduced-motion:reduce){.pd-st,.pd-av,.pd-cr,.pd-conf i{animation:none!important}.pd-conf{display:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .podium{background:linear-gradient(180deg,#2A2310,#161618);border-color:#4A3D14}:root:not([data-theme="light"]) .pd-ttl{color:#FFD866}}
:root[data-theme="dark"] .podium{background:linear-gradient(180deg,#2A2310,#161618);border-color:#4A3D14}:root[data-theme="dark"] .pd-ttl{color:#FFD866}

/* progres live & pembahasan */
.prog{background:var(--soft,#F5F5F7);border-radius:12px;padding:10px 12px;margin:4px 0 12px}.pg-h{display:flex;gap:8px;align-items:baseline;font-size:13px}.pg-h span{color:var(--muted)}.pg-h .sp{flex:1}
.pg-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}.pg-bar i{display:block;height:100%;background:linear-gradient(90deg,#F5C518,#34C759);border-radius:999px;transition:width .6s}
.pg-r{margin-top:6px;max-width:320px}.pg-r small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}.pg-r small b{color:var(--ink)}.pg-r.done .pg-bar i{background:#34C759}
.bhs .bhs-in{width:min(980px,96vw);max-height:94vh;overflow:auto;background:var(--card,#fff);border-radius:22px;padding:20px 22px}
.bhs-top{display:flex;gap:10px;align-items:center}.bhs-top small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.bhs-top b{font-size:18px}.bhs-top .sp{flex:1}.bhs-nm{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.bhs-q{font-size:clamp(18px,2.4vw,26px);font-weight:800;line-height:1.35;margin:16px 0 14px}
.bhs-o{display:grid;gap:10px}.bo{border:2px solid var(--line);border-radius:14px;padding:10px 12px}.bo.ok{border-color:#34C759;background:rgba(52,199,89,.08)}.bo.none{border-style:dashed}
.bo-t{display:flex;gap:10px;align-items:center;font-size:15px}.bo-t .tx{flex:1}.bo-t b{font-size:20px;font-weight:900}.bo.ok .bo-t .tx::after{content:"  ✓";color:#1E8E3E;font-weight:900}
.bo-bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}.bo-bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
.bo-bar.t0 i{background:#E21B3C}.bo-bar.t1 i{background:#1368CE}.bo-bar.t2 i{background:#D89E00}.bo-bar.t3 i{background:#26890C}.bo.ok .bo-bar i{background:#34C759}
.bo-nm{font-size:12.5px;color:var(--muted);margin-top:6px}
.bhs-k{margin-top:14px;background:var(--soft,#F5F5F7);border-radius:12px;padding:12px 14px;font-size:14.5px}.bhs-k p{margin:6px 0 0;color:var(--muted);line-height:1.5}
.bhs-who{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:10px}.bw{border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}.bw>b{flex-basis:100%;font-size:13.5px}
.bw.bad{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.35)}.bw.bad>b{color:#C62828}.bw.ok{background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.35)}.bw.ok>b{color:#1E8E3E}
.bw span{background:var(--card,#fff);border:1px solid var(--line);border-radius:999px;padding:3px 10px}.bw span i{font-style:normal;color:var(--muted);font-size:12px}.bw em{color:var(--muted);font-size:12.5px}
@media (max-width:640px){.bhs-who{grid-template-columns:1fr}}
.bhs-nav{display:flex;gap:10px;align-items:center;margin-top:16px}.bhs-dots{flex:1;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bhs-dots button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card,#fff);color:var(--ink);font:700 11.5px var(--font,inherit);cursor:pointer}.bhs-dots button.hard{border-color:#E5484D;color:#C62828}.bhs-dots button.on{background:#1D1D1F;color:#fff;border-color:#1D1D1F}
.bhs-leg{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}.bhs-leg .hard{color:#C62828;font-weight:700}
@media (max-width:640px){.bhs-nav{flex-wrap:wrap}.bhs-dots{order:3;flex-basis:100%}}

/* live scoreboard */
.race{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rr{display:flex;align-items:center;gap:10px;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px;padding:7px 10px;will-change:transform}
.rr .rk{width:26px;text-align:center;font-weight:900;font-size:14px;color:var(--muted)}.rr .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;background:#6E6E73;flex:none}

<body>
<header class="top"><a href="/"><img src="wordmark.png" alt="GlobalXtreme"></a><b>Quiz</b><span class="sp"></span><a class="btn sm" href="/knowledge-base#quiz">Knowledge Base</a></header>
<main id="app"><div class="msg">Memuat…</div></main>
<div class="toast" id="toast"></div>
<script src="kb-data.js"></script>
<script src="qrcode.js"></script><!-- qrcode-generator 1.4.4 (MIT, Kazuhiko Arase) -->
<script>
/* Quiz Knowledge Base — terpisah dari materi. Mode:
   • Latihan (per kategori, ada timer, skor tersimpan di HP sendiri)
   • Live quiz ala Kahoot: SPV membuat sesi → tim scan QR / masukkan PIN di HP → timer per soal → leaderboard → review jawaban
   Skor live dihitung di server (kunci jawaban tidak dikirim ke HP pemain sebelum selesai). */
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); }
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let CATS = window.KB_CATS || [], BASE = window.KB_MATERI || [];
let SETS = [], SETNAME = {};
const setSets = () => { SETS = [...CATS.map(c => [c[0], c[1]]), ['all', 'Semua materi']]; SETNAME = Object.fromEntries(SETS); };
setSets();
let MAT = BASE;   // materi setelah edit SPV (override, tambahan, hapus) dari Knowledge Base
const SHAPES = ['<svg viewBox="0 0 24 24"><path d="M12 3 22 20H2z"/></svg>', '<svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></svg>', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>', '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtS = ms => (ms / 1000).toFixed(1) + ' dtk';
let HIDDEN = new Set(), IS_SPV = false, ONLINE = true;

/* ---------- soal per set (dari kb-data.js; materi yang dihapus SPV ikut tidak dipakai) ---------- */
function questions(set) {
  return MAT.filter(m => !HIDDEN.has(m.id) && (set === 'all' || m.cat === set)).flatMap(m => (m.quiz || []).map(q => ({ ...q, src: m.title })));
}
function prepare(list, n) {   // acak soal & urutan opsi
  return shuffle(list).slice(0, n || list.length).map(q => { const p = shuffle([...q.o.keys()]); return { q: q.q, o: p.map(i => q.o[i]), a: p.indexOf(q.a), e: q.e, src: q.src }; });
}

/* ---------- API (+ mode preview tanpa server: disimpan di browser ini) ---------- */
async function call(path, opt = {}) {
  try { const r = await fetch('/api/quiz' + path, { cache: 'no-store', credentials: 'same-origin', ...opt, headers: opt.body ? { 'content-type': 'application/json' } : {} }); const j = await r.json(); return { status: r.status, j }; }
  catch (e) { return null; }
}
const LOCAL = {
  all: () => LS.get('gx-quiz-local', {}), save: d => LS.set('gx-quiz-local', d),
  create(c) { const d = this.all(), code = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''); d[code] = { ...c, code, status: 'open', created_at: new Date().toISOString(), results: [] }; this.save(d); return code; },
  get(code) { return this.all()[code]; },
};
const pts = (ok, ms, t) => ok ? Math.round(1000 * (1 - Math.min(1, ms / (t * 1000)) / 2)) : 0;
const API = {
  async session(code) { const r = await call('?code=' + code); if (r) { ONLINE = true; return r.status === 200 ? r.j.session : null; } ONLINE = false; const s = LOCAL.get(code); return s ? { ...s, n: s.questions.length, questions: s.questions.map(x => ({ q: x.q, o: x.o })) } : null; },
  async board(code) { const r = await call('?code=' + code + '&board=1'); if (r) return r.j.board || []; const s = LOCAL.get(code); return s ? s.results.slice().sort((a, b) => b.score - a.score || a.duration_ms - b.duration_ms) : []; },
  async submit(code, player, answers, token) {
    const r = await call('', { method: 'POST', body: JSON.stringify({ code, player, token, answers }) }); if (r) return r;
    const d = LOCAL.all(), s = d[code]; if (!s) return { status: 404, j: { error: 'not-found' } };
    if (s.results.some(x => x.player.toLowerCase() === player.toLowerCase())) return { status: 409, j: { error: 'name-taken', detail: 'Nama ini sudah dipakai di sesi ini — pakai nama lain.' } };
    const ans = s.questions.map((x, i) => { const a = answers[i] || {}; const ms = Math.min(s.timer_s * 1000, a.ms || s.timer_s * 1000); return { c: a.c ?? null, ms, p: pts(a.c === x.a, ms, s.timer_s) }; });
    const row = { player, score: ans.reduce((t, a) => t + a.p, 0), correct: ans.filter((a, i) => a.c === s.questions[i].a).length, total: s.questions.length, duration_ms: ans.reduce((t, a) => t + a.ms, 0), answers: ans, created_at: new Date().toISOString() };
    s.results.push(row); const jp = (s.joins || {})[player.toLowerCase()]; if (jp) jp.status = 'done'; LOCAL.save(d); const B = await this.board(code);
    return { status: 200, j: { result: row, rank: B.findIndex(x => x.player === player) + 1, players: B.length, review: s.questions.map((x, i) => ({ ...x, ...ans[i] })) } };
  },
  async join(code, player, token, av) {
    const r = await call('', { method: 'POST', body: JSON.stringify({ join: { code, player, token, av } }) }); if (r) return r;
    const d = LOCAL.all(), s = d[code]; if (!s) return { status: 404, j: { error: 'not-found' } }; s.joins = s.joins || {};
    const k = player.toLowerCase(), p = s.joins[k]; if (p && p.token === token) return { status: 200, j: p };
    if ((p && p.status !== 'rejected') || s.results.some(x => x.player.toLowerCase() === k)) return { status: 409, j: { error: 'name-taken', detail: 'Nama ini sudah dipakai di sesi ini — pakai nama lain.' } };
    s.joins[k] = { player, name: player, token: Math.random().toString(36).slice(2), status: 'pending', at: new Date().toISOString() }; LOCAL.save(d); return { status: 200, j: s.joins[k] };
  },
  async me(code, token) {
    const r = await call('?code=' + code + '&me=' + encodeURIComponent(token)); if (r) return r;
    const s = LOCAL.get(code); const p = s && Object.values(s.joins || {}).find(x => x.token === token); if (!p) return { status: 404, j: { error: 'not-joined' } };
    return { status: 200, j: { status: p.status, player: p.name, session: p.status === 'approved' ? { ...s, questions: s.questions.map(x => ({ q: x.q, o: x.o })) } : { ...s, questions: undefined, n: s.questions.length } } };
  },
  async progress(code) { const r = await call('?code=' + code + '&progress=1'); return r && r.status === 200 ? (r.j.progress || []) : []; },
  sendProgress(code, token, answers) { call('', { method: 'POST', body: JSON.stringify({ progress: { code, token, answers } }) }).catch(() => {}); },
  async joins(code) { const r = await call('?code=' + code + '&joins=1'); if (r) return r; const s = LOCAL.get(code); return { status: 200, j: { players: Object.values((s && s.joins) || {}) } }; },
  async decide(code, player, act) {
    const body = act === 'all' ? { approveAll: code } : { [act]: { code, player } }; const r = await call('', { method: 'POST', body: JSON.stringify(body) }); if (r) return r;
    const d = LOCAL.all(), s = d[code]; if (!s) return { status: 404, j: {} }; s.joins = s.joins || {};
    for (const p of Object.values(s.joins)) { if (act === 'all' ? p.status === 'pending' : p.name.toLowerCase() === player.toLowerCase()) { if (act === 'allowRetry') { s.results = s.results.filter(x => x.player.toLowerCase() !== p.name.toLowerCase()); p.status = 'rejected'; p.token = 'x' + Math.random(); } else p.status = act === 'reject' ? 'rejected' : 'approved'; } }
    LOCAL.save(d); return { status: 200, j: { ok: true } };
  },
  async results(code) { const r = await call('?code=' + code + '&results=1'); if (r) return r; const s = LOCAL.get(code); return { status: 200, j: { questions: s.questions, timer_s: s.timer_s, results: s.results } }; },
  async refresh(code, qs) { const r = await call('', { method: 'POST', body: JSON.stringify({ refresh: { code, questions: qs } }) }); if (r) return r; const d = LOCAL.all(); if (d[code] && !d[code].results.length) { d[code].questions = qs; LOCAL.save(d); return { status: 200, j: { ok: true } }; } return { status: 409, j: { detail: 'Sudah ada peserta yang mengerjakan.' } }; },
  async create(c) { const r = await call('', { method: 'POST', body: JSON.stringify({ create: c }) }); if (r) return r; return { status: 200, j: { code: LOCAL.create(c) } }; },
  async list() { const r = await call('?list=1'); if (r) return r; const d = LOCAL.all(); return { status: 200, j: { sessions: Object.values(d).reverse().map(s => ({ ...s, n: s.questions.length, players: s.results.length })) } }; },
  async setStatus(code, close) { const r = await call('', { method: 'POST', body: JSON.stringify(close ? { close: code } : { reopen: code }) }); if (r) return r; const d = LOCAL.all(); if (d[code]) d[code].status = close ? 'closed' : 'open'; LOCAL.save(d); return { status: 200, j: {} }; },
  async del(code) { const r = await call('?code=' + code, { method: 'DELETE' }); if (r) return r; const d = LOCAL.all(); delete d[code]; LOCAL.save(d); return { status: 200, j: {} }; },
};
const joinUrl = code => new URL('/knowledge-base#quiz?c=' + code, location.href).href;   // QR membuka tab Quiz di Knowledge Base
const EMBED = new URLSearchParams(location.search).has('embed'); if (EMBED) document.body.classList.add('embed');
function lockScreen() {
  app.innerHTML = `<div class="lock"><div class="ic">🔒</div><h1>Quiz dikunci</h1><p class="lead" style="margin:0"><a href="/login?next=%2Fknowledge-base%23quiz" target="_top" style="font-weight:700">Login dengan username kamu</a> untuk membuka quiz, atau masukkan password tim. Materi Knowledge Base tetap bisa dibaca tanpa password.</p>
    <form id="lkF"><input type="password" id="lkPw" placeholder="Password tim" autocomplete="current-password" autofocus><button class="btn y">Buka</button></form>
    <p style="font-size:12.5px;color:var(--muted);margin:14px 0 0">SPV? <a href="#" id="lkSpv">Login SPV</a></p>
    <form id="spvF" method="post" action="/api/login" class="hidden" target="_top"><input type="hidden" name="next" value="/knowledge-base#quiz"><input type="password" name="password" placeholder="Password dashboard SPV"><button class="btn pri">Login</button></form></div>`;
  $('#lkF').onsubmit = async e => { e.preventDefault(); const pw = $('#lkPw').value; if (!pw) return;
    let r = null; try { r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ team: 1, password: pw }) }); } catch (e) {}
    if (r && r.ok) { toast('Quiz terbuka ✓'); route(); } else toast(r && r.status === 503 ? 'Password tim belum diatur di server (GX_TEAM_PASSWORD)' : 'Password salah'); };
  $('#lkSpv').onclick = e => { e.preventDefault(); $('#spvF').classList.remove('hidden'); $('#lkF').classList.add('hidden'); $('#spvF input[type=password]').focus(); };
}
async function unlocked() { if (!ONLINE) return true; try { const r = await fetch('/api/login', { cache: 'no-store', credentials: 'same-origin' }); const j = await r.json(); return !!(j && (j.team || j.authed || j.member)); } catch (e) { return true; } }

/* ======================= HOME ======================= */
function home() {
  history.replaceState(null, '', location.pathname + (EMBED ? '?embed=1' : ''));
  const best = LS.get('gx-quiz-best', {});
  app.innerHTML = `<h1>Quiz Knowledge Base</h1><p class="lead">Masukkan PIN dari SPV untuk ikut live quiz, atau latihan sendiri per kategori. Setiap soal ada timernya — makin cepat jawab benar, makin besar poinnya.</p>
    <form class="join" id="joinF"><input id="pinIn" placeholder="PIN" maxlength="8" autocomplete="off" aria-label="PIN quiz"><button class="btn y" style="font-size:16px;padding:12px 22px">Ikut quiz →</button></form>
    ${IS_SPV ? `<div class="h2">Live quiz (SPV)</div><div class="panel"><div class="fg">
      <div><label>Set soal</label><select id="hSet">${SETS.map(([k, l]) => `<option value="${k}" ${k === 'admin' ? 'selected' : ''}>${esc(l)} (${questions(k).length} soal)</option>`).join('')}</select></div>
      <div><label>Jumlah soal</label><select id="hN"><option value="10">10 soal acak</option><option value="20">20 soal acak</option><option value="35" selected>35 soal</option><option value="0">Semua soal</option></select></div>
      <div><label>Waktu per soal</label><select id="hT"><option value="10">10 detik</option><option value="20" selected>20 detik</option><option value="30">30 detik</option><option value="45">45 detik</option></select></div>
      <div><label>Judul sesi</label><input id="hTitle" placeholder="mis. Test Administrasi — Nov 2026"></div></div>
      <button class="btn pri" id="hCreate">Buat sesi & tampilkan QR</button></div>
      <div class="h2">Riwayat sesi</div><div id="sessList" class="panel"><div class="msg" style="border:0;padding:0">Memuat…</div></div>
      <details class="h2d"${QB.open ? ' open' : ''}><summary class="h2">📝 Bank soal (SPV) — ubah, tambah & hapus soal</summary><div id="bank" class="panel"></div></details>` : ''}
    <div class="h2">Latihan per kategori</div><div class="sets">${SETS.map(([k, l]) => { const n = questions(k).length, b = best[k]; return `<div class="set ${k}"><b>${esc(l)}</b><span>${n} soal${b ? ` · skor terbaikmu ${b.score} (${b.correct}/${b.total})` : ''}</span><div class="row"><button class="btn sm" data-prac="${k}" data-n="10">10 soal</button><button class="btn sm pri" data-prac="${k}" data-n="35">35 soal</button></div></div>`; }).join('')}</div>`;
  $('#joinF').onsubmit = e => { e.preventDefault(); const c = $('#pinIn').value.trim().toUpperCase(); if (c) go('?c=' + c); };
  if (IS_SPV) { $('#hCreate').onclick = createSession; loadSessions(); drawBank(); const d = document.querySelector('details.h2d'); if (d) d.ontoggle = () => { QB.open = d.open; }; }
}
async function loadSessions() {
  const r = await API.list(), el = $('#sessList'); if (!el) return;
  if (!r || r.status !== 200) { el.innerHTML = `<div class="msg" style="border:0;padding:0">${r && r.j.error === 'schema-missing' ? 'Tabel quiz belum dibuat — jalankan <b>spv-schema.sql</b> di Supabase.' : 'Gagal memuat sesi.'}</div>`; return; }
  const S = r.j.sessions || [];
  el.innerHTML = S.length ? `<table class="tbl"><thead><tr><th>PIN</th><th>Sesi</th><th>Soal</th><th>Peserta</th><th>Status</th><th></th></tr></thead><tbody>${S.map(s => `<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.title || SETNAME[s.set_key] || s.set_key)}<br><span style="font-size:11.5px;color:var(--muted)">${new Date(s.created_at).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}</span></td><td>${s.n} · ${s.timer_s}s</td><td>${s.players}</td><td><span class="pill ${s.status}">${s.status === 'open' ? 'Buka' : 'Tutup'}</span></td><td><button class="btn sm" data-host="${esc(s.code)}">Buka</button></td></tr>`).join('')}</tbody></table>` : '<div class="msg" style="border:0;padding:0">Belum ada sesi.</div>';
}
async function createSession() {
  const set = $('#hSet').value, all = questions(set); if (!all.length) return toast('Set ini belum punya soal');
  const qs = prepare(all, +$('#hN').value), title = $('#hTitle').value.trim() || `Quiz ${SETNAME[set]} — ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}`;
  $('#hCreate').disabled = true;
  const r = await API.create({ title, set_key: set, timer_s: +$('#hT').value, questions: qs });
  $('#hCreate').disabled = false;
  if (r.status === 200) go('?host=' + r.j.code); else toast(r.j.error === 'login-required' ? 'Login SPV dulu di Helpdesk Management' : (r.j.detail || 'Gagal membuat sesi'));
}

/* ======================= HOST ======================= */
let poll = null;
async function host(code) {

/* ===== Live scoreboard ala Kahoot: skor sementara semua peserta, posisi bergeser beranimasi saat saling salip ===== */
function raceRows(P, PG, B) {
  const by = {}; (B || []).forEach(x => { by[x.player.toLowerCase()] = x; });
  return P.filter(p => p.status === 'approved' || p.status === 'done').map(p => { const k = String(p.name).toLowerCase(), f = by[k], g = PG[k];
    return f ? { av: p.av, name: p.name, score: f.score, i: f.total, n: f.total, correct: f.correct, done: true } : { av: p.av, name: p.name, score: g ? g.score : 0, i: g ? g.i : 0, n: g ? g.n : 0, correct: g ? g.correct : 0, done: false }; })

const RANKS = new WeakMap();

    if (lp.dataset.sig !== sig) { lp.dataset.sig = sig; lp.innerHTML = top.length ? podiumHtml(top, null, big, true) : ''; } } const prevPos = {}, prevRank = RANKS.get(box) || {}, top = Math.max(1, ...rows.map(r => r.score));
  box.querySelectorAll('.rr').forEach(el => { prevPos[el.dataset.k] = el.getBoundingClientRect().top; });
  const keep = new Set();
  rows.forEach((r, idx) => { const k = r.name.toLowerCase(); keep.add(k); let el = box.querySelector(`.rr[data-k="${CSS.escape(k)}"]`);
    if (!el) { el = document.createElement('div'); el.className = 'rr'; el.dataset.k = k; el.innerHTML = `<span class="rk"></span><span class="av"></span><div class="mid"><div class="nm"><b></b><small></small></div><div class="rb"><i></i></div></div><span class="mv"></span><b class="sc">0</b>`; el.querySelector('.av').outerHTML = avHtml(r.av, r.name, 'av'); el.querySelector('.nm b').textContent = r.name; }
    const was = prevRank[k], mv = el.querySelector('.mv');
    if (was != null && was !== idx) { mv.textContent = was > idx ? '▲' + (was - idx) : '▼' + (idx - was); mv.className = 'mv ' + (was > idx ? 'up' : 'dn'); clearTimeout(el._mv); el._mv = setTimeout(() => { mv.textContent = ''; mv.className = 'mv'; }, 4000); }
    el.classList.toggle('done', r.done); el.classList.toggle('lead', idx === 0 && r.score > 0);
    el.querySelector('.rk').textContent = idx < 3 && r.score > 0 ? ['🥇', '🥈', '🥉'][idx] : idx + 1;
    el.querySelector('.nm small').textContent = r.done ? `✓ selesai · ${r.correct}/${r.n} benar` : r.n ? `soal ${r.i}/${r.n} · ${r.correct} benar` : 'belum menjawab';
    el.querySelector('.rb i').style.width = Math.round(r.score / top * 100) + '%';
    countUp(el.querySelector('.sc'), r.score); box.appendChild(el); });
  box.querySelectorAll('.rr').forEach(el => { if (!keep.has(el.dataset.k)) el.remove(); });
  /* FLIP: geser dari posisi lama ke posisi baru */
  box.querySelectorAll('.rr').forEach(el => { const t0 = prevPos[el.dataset.k]; if (t0 == null) { el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 350 }); return; }
    const d = t0 - el.getBoundingClientRect().top; if (Math.abs(d) > 2) el.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)' }); });

/* ===== Bahas soal (SPV): satu soal per layar — sebaran jawaban, kunci, penjelasan & siapa memilih apa ===== */

  const draw = () => { const { q, cnt, none, ok } = stats(i), n = R.length, pct = v => n ? Math.round(v / n * 100) : 0;
    const hard = Q.map((_, k) => stats(k).ok / n);
    m.innerHTML = `<div class="bhs-in"><div class="bhs-top"><div><small>📖 PEMBAHASAN · ${esc(title || 'Live quiz')}</small><b>Soal ${i + 1} / ${Q.length}</b></div><span class="sp"></span><label class="bhs-nm"><input type="checkbox" id="bhNm" ${names ? 'checked' : ''}> tampilkan nama</label><button class="btn sm" data-x>Tutup</button></div>

      <div class="bhs-o">${q.o.map((o, j) => `<div class="bo ${j === q.a ? 'ok' : ''}"><div class="bo-t"><span class="sh">${SHAPES[j % 4]}</span><span class="tx">${esc(o)}</span><b>${cnt[j].length}</b></div><div class="bo-bar t${j % 4}"><i style="width:${pct(cnt[j].length)}%"></i></div>${names && cnt[j].length ? `<div class="bo-nm">${cnt[j].map(esc).join(', ')}</div>` : ''}</div>`).join('')}

      ${(() => { const wrong = q.o.flatMap((o, j) => j === q.a ? [] : cnt[j].map(nm => [nm, o])), right = cnt[q.a];

          <div class="bw ok"><b>✓ Benar (${right.length})</b>${right.length ? right.map(nm => `<span>${esc(nm)}</span>`).join('') : '<em>Belum ada</em>'}</div></div>`; })()}

  const p = new URLSearchParams(location.search);
  if (p.get('c')) return joinScreen(p.get('c').toUpperCase());
  if (p.get('host')) return host(p.get('host').toUpperCase());
  if (p.get('set') && SETNAME[p.get('set')]) return practice(p.get('set'), 0);
  home();
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-home]')) return go('');
  const pr = e.target.closest('[data-prac]'); if (pr) return practice(pr.dataset.prac, +pr.dataset.n);
  const h = e.target.closest('[data-host]'); if (h) return go('?host=' + h.dataset.host);
  const rv = e.target.closest('[data-rv]'); if (rv && HOSTCODE) return reviewPlayer(HOSTCODE, rv.dataset.rv);
  const dc = e.target.closest('[data-dec]'); if (dc && HOSTCODE) { if (dc.dataset.dec === 'allowRetry' && !confirm('Hapus hasil ' + dc.dataset.p + ' supaya bisa mengulang quiz? Peserta perlu daftar & di-approve lagi.')) return; dc.disabled = true; return API.decide(HOSTCODE, dc.dataset.p, dc.dataset.dec).then(() => HOSTTICK && HOSTTICK()); }
  const t = e.target.closest('.tile[data-c]'); if (t && G && !G.locked) answer(+t.dataset.c);
});
document.addEventListener('keydown', e => { if (G && !G.locked && /^[1-6]$/.test(e.key) && document.querySelector('.tile')) { const t = document.querySelector(`.tile[data-c="${+e.key - 1}"]`); if (t) answer(+e.key - 1); } });
/* ======================= BANK SOAL (SPV) — ubah, tambah, hapus soal; tersimpan di Knowledge Base ======================= */
const QB = { doc: null, rev: null, set: 'all', q: '', npages: {} };
async function loadBank() {   // ambil ulang materi + soal terbaru dari server (dipakai juga tombol ↻ Refresh)
  try { const r = await fetch('/api/todo?doc=knowledge-base', { cache: 'no-store', credentials: 'same-origin' }); const j = await r.json(); IS_SPV = !!j.canEdit;
    QB.doc = j.data && j.data.HD ? j.data : (j.data || null); QB.rev = j.revision || null;
    const M = (j.data && j.data.materi) || {}, over = M.over || {}; HIDDEN = new Set(M.hidden || []);
    MAT = BASE.map(x => over[x.id] ? { ...x, ...over[x.id], quiz: over[x.id].quiz || x.quiz } : x).concat(M.added || [])
      .concat(Object.entries(over).filter(([id, v]) => id.startsWith('n-') && (v.quiz || []).length).map(([id, v]) => ({ id, title: v.title || 'Materi Notion', cat: v.cat || 'umum', ...v })));
    if (j.data && Array.isArray(j.data.cats) && j.data.cats.length) { const D = window.KB_CATS || []; CATS = j.data.cats.concat(D.filter(d => !j.data.cats.some(c => c[0] === d[0]))); setSets(); }
    return true; } catch (e) { return false; }
}
async function loadNotionTitles() { try { const r = await fetch('/api/todo?kb=notion', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); QB.npages = j.pages || {}; } } catch (e) {} }
function bankHtml() {
  const ql = QB.q.toLowerCase(), M = MAT.filter(m => !HIDDEN.has(m.id) && (QB.set === 'all' || m.cat === QB.set) && (m.quiz || []).length);
  const rows = M.map(m => { const Q = (m.quiz || []).map((q, i) => ({ q, i })).filter(({ q }) => !ql || (q.q + ' ' + q.o.join(' ') + ' ' + m.title).toLowerCase().includes(ql)); if (!Q.length) return '';
    return `<div class="bkm"><div class="bkh"><b>${esc(m.title)}</b><span>${(m.quiz || []).length} soal · ${esc(SETNAME[m.cat] || m.cat)}</span><span style="flex:1"></span><button class="btn sm" data-bkadd="${esc(m.id)}">+ Soal</button></div>
      ${Q.map(({ q, i }) => `<div class="bkq"><span class="n">${i + 1}</span><div><div>${esc(q.q)}</div><small>✓ ${esc(q.o[q.a] || '—')}</small></div><button class="btn sm" data-bked="${esc(m.id)}|${i}" aria-label="Edit soal">✎</button><button class="btn sm danger" data-bkdel="${esc(m.id)}|${i}" aria-label="Hapus soal">🗑</button></div>`).join('')}</div>`; }).join('');
  return rows || `<div class="msg" style="border:0;padding:6px 0">${ql ? 'Tidak ada soal yang cocok.' : 'Belum ada soal di set ini — klik + Soal baru.'}</div>`;
}
function drawBank() { const el = $('#bank'); if (!el) return; const n = questions(QB.set).length;
  el.innerHTML = `<div class="bkbar"><select id="bkSet">${SETS.map(([k, l]) => `<option value="${k}" ${k === QB.set ? 'selected' : ''}>${esc(l)} (${questions(k).length})</option>`).join('')}</select>
    <input id="bkQ" type="search" placeholder="Cari soal…" value="${esc(QB.q)}"><span style="flex:1"></span><button class="btn sm" id="bkRef" title="Ambil soal terbaru (setelah diubah di Knowledge Base / perangkat lain)">↻ Refresh soal</button><button class="btn sm pri" id="bkNew">+ Soal baru</button></div>
    <div class="bkl">${bankHtml()}</div><div class="bkfoot">${n} soal di set ini · perubahan langsung dipakai untuk latihan & sesi live baru, dan ikut tampil di materi Knowledge Base.</div>`; }
async function saveBank(mutate) {
  for (let t = 0; t < 2; t++) {
    if (!QB.doc) await loadBank(); const D = JSON.parse(JSON.stringify(QB.doc || {})); D.materi = D.materi || { over: {}, added: [], hidden: [] }; D.materi.over = D.materi.over || {}; D.materi.added = D.materi.added || [];
    mutate(D.materi);
    const r = await fetch('/api/todo', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ doc: 'knowledge-base', data: D, revision: QB.rev }) }).catch(() => null);
    if (r && r.status === 200) { await loadBank(); drawBank(); toast('Soal tersimpan ✓'); return true; }
    if (r && r.status === 409) { await loadBank(); continue; }   // diubah di tempat lain → ambil versi terbaru lalu ulangi
    toast(r && r.status === 401 ? 'Login SPV dulu' : 'Gagal menyimpan soal'); return false;
  }
  toast('Soal sedang diubah di tempat lain — coba lagi'); return false;
}
const quizOf = (MM, id) => { const b = BASE.find(x => x.id === id), ad = (MM.added || []).find(x => x.id === id), ov = MM.over[id] || {};
  return { get: () => JSON.parse(JSON.stringify(ad ? ad.quiz || [] : ov.quiz || (b ? b.quiz || [] : []))), set: Q => { if (ad) ad.quiz = Q; else MM.over[id] = { ...ov, quiz: Q }; } }; };
function qModal(mid, idx) {
  const m = MAT.find(x => x.id === mid), q = m && idx != null ? m.quiz[idx] : { q: '', o: ['', '', '', ''], a: 0, e: '' }, o = [...q.o, '', '', '', ''].slice(0, Math.max(4, q.o.length));
  const NP = Object.entries(QB.npages).filter(([id, p]) => p.n && !MAT.some(x => x.id === 'n-' + id) && !BASE.some(b => String(b.src || '').replace(/-/g, '').toLowerCase().endsWith(id)));
  const el = document.createElement('div'); el.className = 'modal';
  el.innerHTML = `<div class="box" style="max-width:620px"><h3 style="margin:0 0 12px">${idx != null ? 'Edit soal' : 'Soal baru'}</h3>
    ${mid ? `<p style="margin:0 0 10px;font-size:13px;color:var(--muted)">Materi: <b>${esc(m ? m.title : mid)}</b></p>` : `<label class="fl">Materi</label><select id="qmM">${MAT.filter(x => !HIDDEN.has(x.id)).map(x => `<option value="${esc(x.id)}" ${x.cat === QB.set ? 'selected' : ''}>${esc(x.title)} · ${esc(SETNAME[x.cat] || x.cat)}</option>`).join('')}${NP.length ? `<optgroup label="Halaman Notion (belum ada soal)">${NP.map(([id, p]) => `<option value="n-${id}">${esc(p.t)}</option>`).join('')}</optgroup>` : ''}</select>
      <div id="qmCatW" class="hidden"><label class="fl">Masuk set quiz</label><select id="qmCat">${CATS.map(c => `<option value="${esc(c[0])}" ${c[0] === QB.set ? 'selected' : ''}>${esc(c[1])}</option>`).join('')}</select></div>`}
    <label class="fl">Pertanyaan</label><textarea id="qmQ" rows="3">${esc(q.q)}</textarea>
    <label class="fl">Pilihan jawaban — klik bulatan untuk jawaban yang benar</label>${o.map((v, j) => `<label class="qmo"><input type="radio" name="qmA" value="${j}" ${q.a === j ? 'checked' : ''}><input data-o="${j}" value="${esc(v)}" placeholder="Opsi ${'ABCDEF'[j]}${j > 1 ? ' (opsional)' : ''}"></label>`).join('')}
    <label class="fl">Penjelasan (muncul saat review)</label><input id="qmE" value="${esc(q.e || '')}">
    <div style="display:flex;gap:8px;margin-top:14px"><span style="flex:1"></span><button class="btn" data-x>Batal</button><button class="btn pri" data-ok>Simpan</button></div></div>`;
  document.body.appendChild(el);
  const ms = el.querySelector('#qmM'), cw = el.querySelector('#qmCatW'); if (ms) { const f = () => cw.classList.toggle('hidden', !ms.value.startsWith('n-') || MAT.some(x => x.id === ms.value)); ms.onchange = f; f(); }
  el.onclick = async e => { if (e.target === el || e.target.closest('[data-x]')) return el.remove(); if (!e.target.closest('[data-ok]')) return;
    const qq = el.querySelector('#qmQ').value.trim(), opts = [...el.querySelectorAll('[data-o]')].map(i => ({ v: i.value.trim(), j: +i.dataset.o })).filter(x => x.v), aj = +((el.querySelector('[name=qmA]:checked') || {}).value ?? -1), a = opts.findIndex(x => x.j === aj);
    if (!qq || opts.length < 2) return toast('Isi pertanyaan & minimal 2 opsi'); if (a < 0) return toast('Pilih jawaban yang benar (bulatan di opsi yang terisi)');
    const nq = { q: qq, o: opts.map(x => x.v), a, e: el.querySelector('#qmE').value.trim() }, id = mid || ms.value;
    const ok = await saveBank(MM => { const h = quizOf(MM, id), Q = h.get(); if (idx != null) Q[idx] = nq; else Q.push(nq); h.set(Q);
      if (id.startsWith('n-')) { const p = QB.npages[id.slice(2)] || {}; MM.over[id] = { ...MM.over[id], title: MM.over[id].title || p.t || 'Materi Notion', cat: MM.over[id].cat || (el.querySelector('#qmCat') || {}).value || QB.set } } });
    if (ok) el.remove(); };
}
document.addEventListener('click', async e => {
  if (!$('#bank')) return;
  if (e.target.id === 'bkRef') { e.target.disabled = true; await loadBank(); await loadNotionTitles(); drawBank(); toast('Soal terbaru dimuat ✓'); return; }
  if (e.target.id === 'bkNew') { await loadNotionTitles(); return qModal(null, null); }
  const a = e.target.closest('[data-bkadd]'); if (a) return qModal(a.dataset.bkadd, null);
  const ed = e.target.closest('[data-bked]'); if (ed) { const [id, i] = ed.dataset.bked.split('|'); return qModal(id, +i); }
  const dl = e.target.closest('[data-bkdel]'); if (dl) { const [id, i] = dl.dataset.bkdel.split('|'), m = MAT.find(x => x.id === id); if (!confirm('Hapus soal ini?\n\n' + ((m && m.quiz[+i] || {}).q || ''))) return;
    return saveBank(MM => { const h = quizOf(MM, id), Q = h.get(); Q.splice(+i, 1); h.set(Q); }); }
});
document.addEventListener('change', e => { if (e.target.id === 'bkSet') { QB.set = e.target.value; drawBank(); } });
document.addEventListener('input', e => { if (e.target.id === 'bkQ') { QB.q = e.target.value; const l = $('#bank .bkl'); if (l) l.innerHTML = bankHtml(); } });
addEventListener('popstate', route);
(async () => {
  try { const r = await fetch('/api/todo?doc=knowledge-base', { cache: 'no-store', credentials: 'same-origin' }); await r.json(); await loadBank(); }
  catch (e) { ONLINE = false; IS_SPV = true; app.insertAdjacentHTML('beforebegin', '<div style="max-width:1100px;margin:16px auto 0;padding:0 18px"><div class="banner" style="margin:0"><b>Mode preview</b> — server belum tersambung; sesi & leaderboard hanya tersimpan di browser ini.</div></div>'); }
  route();
})();
</script>
