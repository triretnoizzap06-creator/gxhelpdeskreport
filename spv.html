<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Helpdesk Management</title>
<link rel="icon" href="mark.png">
<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--muted:#6E6E73;--line:#E5E5EA;--y:#F5C518;--y2:#F5A70A;--ych:#FFF6D1;--g:#16A34A;--gbg:#DCFCE7;--o:#D97706;--obg:#FEF3C7;--r:#DC2626;--rbg:#FEE2E2;--b:#2563EB;--bbg:#DBEAFE;--gr:#71717A;--grbg:#F4F4F5;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .logo{height:24px}.top h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}.top .sp{flex:1}
.tabs{display:flex;gap:4px;background:var(--grbg);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#C7C7CC}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.y{background:var(--y);border-color:var(--y);color:#111}.btn.danger{color:var(--r)}
.btn.sm{padding:5px 9px;font-size:12px}
main{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
.banner{border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px;line-height:1.5}.banner.w{background:var(--obg);color:#92400E}.banner.e{background:var(--rbg);color:#991B1B}.banner.i{background:var(--bbg);color:#1E3A8A}
.hidden{display:none!important}
/* ---------- to-do ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar select,.bar input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px}
.bar .grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.kpi b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi.g b{color:var(--g)}.kpi.o b{color:var(--o)}.kpi.r b{color:var(--r)}.kpi .pbar{height:5px;background:var(--grbg);border-radius:9px;margin-top:6px;overflow:hidden}.kpi .pbar i{display:block;height:100%;background:var(--g)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.blk-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px}.blk-h:first-child{margin-top:4px}.blk-h h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.blk-h span{font-size:12.5px;color:var(--muted)}
.sec.team.HD .sec-h{border-bottom-color:#06B6D4}.sec.team.AM .sec-h{border-bottom-color:#8B5CF6}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--y)}.sec-h h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.sec-h .cnt{font-size:12px;color:var(--muted);font-weight:600}.sec-h .sp{flex:1}
.tt{width:100%;border-collapse:collapse;font-size:13px}
.tt th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{padding:9px 12px;border-bottom:1px solid #F2F2F4;vertical-align:top}
.tt tr:last-child td{border-bottom:0}.tt tbody tr{cursor:pointer}.tt tbody tr:hover td{background:#FAFAFB}
.tt .ti{font-weight:600;white-space:pre-line;line-height:1.4}.tt .rm{color:var(--muted);white-space:pre-line;font-size:12.5px;line-height:1.45;max-width:340px}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--grbg);color:#3F3F46;white-space:nowrap}.cat.VIP{background:#EDE9FE;color:#6D28D9}.cat.Pribadi{background:#FCE7F3;color:#BE185D}.cat.General{background:var(--bbg);color:#1D4ED8}
.lks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lk{display:inline-flex;align-items:center;gap:4px;max-width:260px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--ych);color:#7A5B00;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk:hover{background:#FFEDA0}
.lk svg{width:11px;height:11px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2}
.pri{font-size:11.5px;font-weight:700}.pri.High{color:var(--r)}.pri.Medium{color:var(--o)}.pri.Low{color:var(--gr)}
.st{font-size:11.5px;font-weight:700;border:0;border-radius:99px;padding:4px 8px;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.st.DONE{background:var(--gbg);color:#15803D}.st.IN.PROGRESS,.st.INPROGRESS{background:var(--obg);color:#B45309}.st.PLAN{background:var(--bbg);color:#1D4ED8}.st.NOTSTARTED{background:var(--rbg);color:#B91C1C}
.as{font-size:12px;font-weight:600;white-space:nowrap}.as.HD{color:#0E7490}.as.AM{color:#7C3AED}.as small{display:block;font-weight:500;color:var(--muted)}
.tn{margin-top:6px;font-size:12px;background:#F0FDFA;border-left:3px solid #14B8A6;padding:5px 8px;border-radius:4px;color:#115E59;white-space:pre-line}
.due{font-size:12px;white-space:nowrap}.due.late{color:var(--r);font-weight:700}
.empty{padding:22px 16px;color:var(--muted);font-size:13px}
/* ---------- modal ---------- */
.md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mdb{width:100%;max-width:680px;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mdb h3{margin:0 0 14px;font-size:17px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
.f input,.f select,.f textarea{width:100%;border:1px solid #D2D2D7;border-radius:9px;padding:8px 10px;font-size:13.5px;background:#fff}
.f textarea{resize:vertical;min-height:60px}
.lrow{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;margin-bottom:6px}
.mfoot{display:flex;gap:8px;margin-top:16px;align-items:center}.mfoot .sp{flex:1}
.tnbox{background:#F0FDFA;border-radius:10px;padding:9px 11px;font-size:12.5px;color:#115E59;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
/* ---------- quick links ---------- */
.ql{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:18px}
.qlc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-decoration:none;font-size:13px;font-weight:600}
.qlc:hover{border-color:var(--y)}.qlc i{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFC93C,#F5A70A);color:#fff;font-style:normal;font-size:14px}
.qlc small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
/* ---------- report H1 (replika Figma) ---------- */
.mrh{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:16px}.mryr{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.mryr .btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mrc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.mrc[aria-pressed="true"]{border-color:var(--y);box-shadow:0 0 0 2px var(--y) inset}.mrc b{font-size:15px}.mrc span{font-size:12.5px;color:var(--muted)}
.mrc .tg{display:inline-block;align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:3px 9px;background:var(--y);color:#111}.mrc .tg.arc{background:var(--line);color:var(--muted)}
.mrbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.mrbar .grow{flex:1}.mrbar code{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h1wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.h1nav{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.h1nav button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}.h1nav button[aria-pressed="true"]{background:var(--y);color:#111}
.h1nav .ed{margin-left:14px}.h1nav .btn{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px}.h1nav .btn.danger{color:var(--r)}
.pg{padding:30px 34px 40px;min-height:520px}
.cv{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;min-height:520px;background:#fff;color:var(--ink);padding:44px 50px;position:relative;overflow:hidden}
.cv .kick{font-size:12px;font-weight:800;letter-spacing:.16em;color:#6E6E73}.cv .kick b{color:#D9A400}
.cv h2{font-size:44px;line-height:1;margin:18px 0 6px;font-weight:900;letter-spacing:-.03em}.cv h2 span{display:block;color:#D9A400}
.cv .months{margin-top:18px;font-size:13px;font-weight:800;letter-spacing:.12em;color:#6E6E73}.cv .div{margin-top:8px;color:#3F3F46;font-size:14px}
.cv .by{border-left:3px solid var(--y);padding-left:18px}.cv .by small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:#71717A}.cv .by b{display:block;font-size:24px;margin-top:8px}.cv .by span{color:#6E6E73;font-size:14px}
.cv .glow{position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,.25),transparent 65%)}
.mh{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.mh .no{font-size:46px;font-weight:900;color:var(--y);letter-spacing:-.04em;line-height:1}.mh .mt b{display:block;font-size:20px}.mh .mt span{color:var(--muted);font-size:13px}.mh .sp{flex:1}
.mstat{display:flex;gap:8px;align-items:center}.mstat div{background:var(--grbg);border-radius:10px;padding:7px 12px;text-align:center;min-width:72px}.mstat b{display:block;font-size:20px}.mstat span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ring{width:66px;height:66px}.ring circle{fill:none;stroke-width:6}.ring text{font-size:15px;font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cols{columns:3 340px;column-gap:18px}
.scard{break-inside:avoid;background:#FAFAFA;border:1px solid var(--line);border-radius:12px;padding:14px 16px 6px;margin-bottom:18px}
.scard-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:2px solid var(--y);margin-bottom:6px}.scard-h b{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.scard-h span{font-size:11px;color:var(--muted);font-weight:700}
.tk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #EFEFF1}.tk:last-child{border-bottom:0}
.tk .tx{flex:1;min-width:0}.tk .tx>div{font-size:13px;line-height:1.4;font-weight:500}
.tk .tx a.li{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid #D4D4D8;border-radius:5px;margin-left:5px;vertical-align:-3px;color:#71717A}.tk .tx a.li:hover{border-color:var(--y2);color:var(--y2)}
.tk .tx a.li svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4}
.tk .nt{margin-top:5px;border-left:3px solid var(--y);padding-left:8px;font-size:11.5px;color:#71717A;white-space:pre-line;line-height:1.45}
.sp2{font-size:11px;font-weight:700;white-space:nowrap;padding-top:2px}.sp2::before{content:'●';font-size:8px;margin-right:4px;vertical-align:1px}
.sp2.Done,.sp2.Solved{color:#16A34A}.sp2.InProgress{color:#D97706}.sp2.Plan{color:#71717A}.sp2.NotStarted{color:#DC2626}
.editing .tk,.editing .scard-h b,.editing [data-edc]{cursor:pointer;outline:1px dashed transparent}.editing .tk:hover,.editing .scard-h b:hover,.editing [data-edc]:hover{outline-color:var(--y2);background:#FFFBEA}
.addtk{display:none;width:100%;margin:6px 0 10px;border:1px dashed #D4D4D8;background:transparent;border-radius:8px;padding:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}.editing .addtk{display:block}
.sumk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.sumk div{border:1px solid var(--line);border-radius:12px;padding:14px 16px}.sumk span{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.sumk b{display:block;font-size:30px;font-weight:800;margin-top:4px}
.sumt{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}.sumt th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 12px;background:#FAFAFA}.sumt th:nth-child(-n+2){text-align:left}
.sumt td{padding:9px 12px;border-top:1px solid #F0F0F2;text-align:right;font-weight:700}.sumt td:first-child{text-align:left}.sumt td:nth-child(2){width:50%}.sumt .pb{height:7px;background:#EEE;border-radius:9px;overflow:hidden}.sumt .pb i{display:block;height:100%;background:#22C55E}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}.rec div{border-left:3px solid var(--y);padding:4px 12px}.rec b{display:block;font-size:13px;margin-bottom:4px}.rec p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.notes div{background:#FAFAFA;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}.notes b{font-size:13px}.notes p{margin:5px 0 0;font-size:12.5px;color:#52525B;line-height:1.5}
.h2t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cv{grid-template-columns:1fr}.sumk{grid-template-columns:repeat(2,1fr)}.tt .hm{display:none}}
@media (max-width:600px){.top{flex-wrap:wrap;padding:10px 14px}.top h1{display:none}main{padding:16px 12px 50px}.pg{padding:20px 14px}.cv{padding:30px 22px}.cv h2{font-size:34px}.fg{grid-template-columns:1fr}.lrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a href="/"><img class="logo" src="wordmark.png" alt="GlobalXtreme"></a>
  <h1>Helpdesk Management</h1>
  <div class="tabs" role="tablist"><button data-tab="todo" aria-pressed="true">Personal To-Do List</button><button data-tab="h1" aria-pressed="false">Management Report</button><button data-tab="links" aria-pressed="false">Links</button></div>
  <div class="sp"></div>
  <span id="saveState" style="font-size:12px;color:var(--muted)"></span>
  <a class="btn" href="/api/login?logout=1">Logout</a>
</header>

<main>
  <div id="banner"></div>

  <!-- ================= TO-DO ================= -->
  <section id="tab-todo">
    <div class="bar">
      <select id="month" aria-label="Bulan"></select>
      <button class="btn pri" id="addBtn">+ Task</button>
      <button class="btn" id="copyBtn" title="Salin task Daily, Weekly, Monthly & Pak Ferre dari bulan sebelumnya (status direset)">Salin task rutin dari bulan lalu</button>
      <button class="btn y hidden" id="importBtn">Import Monthly Tracker</button>
      <button class="btn hidden" id="inv25Btn" title="Buat task bulanan tim: update INV VIP di Reminder Bill 25 sesuai pembagian per orang">+ Task INV VIP tgl 25</button>
      <span class="grow"></span>
      <select id="fAs" aria-label="Filter assign"><option value="">Personal + Team</option><option value="me">Personal saja</option><option value="HD">Team Helpdesk saja</option><option value="AM">Team AM saja</option></select>
      <select id="fSt" aria-label="Filter status"><option value="">Semua status</option><option>NOT STARTED</option><option>PLAN</option><option>IN PROGRESS</option><option>DONE</option><option value="OPEN">Belum selesai</option></select>
      <input id="fQ" type="search" placeholder="Cari task…" aria-label="Cari task">
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="secs"></div>
  </section>

  <!-- ================= REPORT H1 ================= -->
  <section id="tab-h1" class="hidden">
    <div class="h2t" style="margin-top:0">Riwayat Management Report</div>
    <div class="mrh" id="mrHist"></div>
    <div class="mrbar" id="mrBar"></div>
    <div id="mrDeck"></div>
    <div class="h1wrap hidden" id="h1wrap">
      <div class="h1nav" id="h1nav"></div>
      <div id="h1page"></div>
    </div>
  </section>

  <!-- ================= LINKS ================= -->
  <section id="tab-links" class="hidden">
    <div class="h2t">Tools Helpdesk (terkunci password)</div>
    <div class="ql" id="qlTools"></div>
    <div class="h2t">Dashboard tim (terbuka untuk tim)</div>
    <div class="ql" id="qlTeam"></div>
    <div class="h2t">Sumber data</div>
    <div class="ql" id="qlSrc"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="mreport.js"></script>
<script>
/* ======================= konstanta ======================= */
const API = '/api/todo';
const SECTIONS = [['DAILY', 'Daily Task'], ['WEEKLY', 'Weekly Task'], ['MONTHLY', 'Monthly Task'], ['FERRE', "Pak Ferre's Tasks"], ['ONEOFF', 'Task One-off']];
const STATUSES = ['NOT STARTED', 'PLAN', 'IN PROGRESS', 'DONE'];
const PRIOS = ['High', 'Medium', 'Low'];
const ROSTER = { HD: [['Kadek Arisita Dhyana Putri', 'Sita'], ['Gede Dimas Pery Narendra', 'Dimas'], ['Bayu Sukma Ramadhan', 'Bayu'], ['A.A Ngurah Kiyana Adhisa Oka Pertama', 'Oka'], ['Nilma Syahrani', 'Rani']],
                 AM: [['Ni Kadek Desi Mirayani', 'Desi'], ['Aulia Sevi Diana', 'Sevia'], ['Devin Bagaskara', 'Bagas']] };
const TEAMNAME = { HD: 'Tim Helpdesk', AM: 'Tim AM' };
const nickOf = n => { for (const t of Object.values(ROSTER)) for (const [f, k] of t) if (f === n) return k; return n; };

/* Monthly Tracker - Putri.xlsx · tab "Oct 2026" (link = hyperlink asli di sel + URL yang tertulis di teks) */
const T_LINK = {
  dcr: 'https://docs.google.com/spreadsheets/d/1WxFd4fhvzN5h9YtTlB13aBfgLphJul_2vGPCzLmtFNE/edit?gid=1323786029',
  csc: 'https://docs.google.com/document/d/1r0zLIpkM9QEFPm3UIvLaG2wHVTNeh038/edit',
  gxcs: 'https://gxcsconnect.globalxtreme-solutions.net/',
  tmrwFlow: 'https://docs.google.com/document/d/1GpNmOTMslbl3hRos6OBg-Tw-HdbSdMyA/edit',
  teamhub: 'https://app.teamhub.com/project/74b69676-bbff-4ab8-8431-296a940fcb4a/board',
  dia: 'https://docs.google.com/spreadsheets/d/1ExYcFHKlltt91fRtwnYrG6G6_a__nnrIQ98Y19jw9gI/edit?gid=1789145925',
  bill: 'https://docs.google.com/spreadsheets/d/19mNgXyeEei_hIwdwS9gfphbzlbPVjdn-/edit?gid=138707526',

  renderHist();
  const def = REPORTS.find(r => r.key === key), url = viewerUrl(key);
  $('#mrBar').innerHTML = `<b style="font-size:13px">Link viewer:</b><code title="${esc(url)}">${esc(url)}</code><button class="btn sm" data-mr-copy="${key}">Salin link</button><a class="btn sm" href="/management-report?r=${key}" target="_blank" rel="noopener">Buka viewer ↗</a><span class="grow"></span>
    ${def.h1 ? `<button class="btn sm" data-mr-h1edit>${MR.h1edit ? '▶ Lihat sebagai slide' : '✎ Edit report H1'}</button>` : '<button class="btn sm" data-mr-refresh>↻ Perbarui dari to-do</button>'}<span id="mrPub" style="font-size:12px;color:var(--muted)"></span>`;
  const editing = !!(def.h1 && MR.h1edit);
  $('#h1wrap').classList.toggle('hidden', !editing); $('#mrDeck').classList.toggle('hidden', editing);
  if (editing) { renderH1(); return; }
  $('#mrDeck').innerHTML = '<div class="empty">Menyiapkan report…</div>';
  const snap = def.h1 ? h1Snap() : await autoSnap(def); if (!snap) return;
  MR.snap[key] = snap;
  MReport.render($('#mrDeck'), snap);
  const ok = await publish(key, snap);
  const st = $('#mrPub'); if (st) st.textContent = ok ? (ST.mode === 'preview' ? 'Preview — viewer membaca data browser ini' : 'Viewer ter-update ✓') : '';
}
$('#tab-h1').addEventListener('click', async e => {
  const yb = e.target.closest('[data-mr-year]'); if (yb) { MR.year = +yb.dataset.mrYear; const r = REPORTS.find(x => x.year === MR.year && repState(x) !== 'next') || REPORTS.find(x => x.year === MR.year); MR.h1edit = false; return openReport(r.key); }
  const o = e.target.closest('[data-mr-open]'); if (o) { MR.h1edit = false; return openReport(o.dataset.mrOpen); }
  const c = e.target.closest('[data-mr-copy]'); if (c) { const u = viewerUrl(c.dataset.mrCopy); try { await navigator.clipboard.writeText(u); toast('Link viewer disalin ✓'); } catch (er) { prompt('Salin link viewer:', u); } return; }
  if (e.target.closest('[data-mr-refresh]')) return openReport(MR.sel);
  if (e.target.closest('[data-mr-h1edit]')) { MR.h1edit = !MR.h1edit; return openReport('h1-2026'); }
});

  team: [['📈', 'Management Report', 'Link viewer H2 2026 (tanpa login)', '/management-report?r=h2-2026'], ['🎧', 'Dashboard Helpdesk', 'To-Do List Helpdesk Customer Support', '/dashboard-helpdesk'], ['💼', 'Dashboard Account Manager', 'To-Do List Account Manager VIP', '/dashboard-am'], ['📚', 'Knowledge Base', 'Helpdesk & Account Manager', '/knowledge-base'], ['🏠', 'Dashboard utama', 'All Report CS', '/']],
  src: [['📗', 'Monthly Tracker - Putri.xlsx', 'Google Drive', 'https://docs.google.com/spreadsheets/d/1RcMydkdifDAad3iEy9eD-gv37rN-4VId/edit?gid=1379858779#gid=1379858779'],
    ['🗂', 'CSO Workspace', 'Detail observation', 'https://cso-workspace.vercel.app']],
};
const qlc = ([i, n, s, h]) => `<a class="qlc" href="${esc(h)}"${/^https?:/.test(h) ? ' target="_blank" rel="noopener"' : ''}><i>${i}</i><span>${esc(n)}<small>${esc(s)}</small></span></a>`;

/* ======================= tabs ======================= */
let HT_SYNC = false;
function showTab(k) { if (HT_SYNC && location.hash !== '#' + k) history.replaceState(null, '', '#' + k); $$('.tabs [data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === k)); ['todo', 'h1', 'links'].forEach(x => $('#tab-' + x).classList.toggle('hidden', x !== k)); try { localStorage.setItem('gx-spv-tab', k); } catch (e) {} if (k === 'h1' && MR.ready) openReport(MR.sel); }
$('.tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); };
const HT = { '#todo': 'todo', '#h1': 'h1', '#links': 'links' };
if (HT[location.hash]) showTab(HT[location.hash]); else { try { const k = localStorage.getItem('gx-spv-tab'); if (k === 'h1' || k === 'links') showTab(k); } catch (e) {} }
addEventListener('hashchange', () => { if (HT[location.hash]) showTab(HT[location.hash]); });
HT_SYNC = true;
Promise.all([loadMonth(), loadDoc()]).then(() => { MR.ready = true; renderHist(); if (!$('#tab-h1').classList.contains('hidden')) openReport(MR.sel); });
</script>
