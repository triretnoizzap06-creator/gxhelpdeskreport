<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard Helpdesk</title>
<link rel="icon" href="mark.png">
<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--muted:#6E6E73;--line:#E5E5EA;--y:#F5C518;--g:#16A34A;--gbg:#DCFCE7;--o:#D97706;--obg:#FEF3C7;--r:#DC2626;--rbg:#FEE2E2;--bbg:#DBEAFE;--grbg:#F4F4F5;--acc:#0E7490;--accbg:#CFFAFE;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.am{--acc:#7C3AED;--accbg:#EDE9FE}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .logo{height:24px;display:block}.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:inherit;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFC93C,#F5A70A);font-size:24px}
.hero h1{margin:0;font-size:24px;letter-spacing:-.01em}.hero p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.who select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.kpi b{font-size:24px;font-weight:800}
.kpi.r b{color:var(--r)}.kpi.o b{color:var(--o)}.kpi.g b{color:var(--g)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card.done{border-left-color:var(--g);opacity:.85}
.ch{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.ch .ti{flex:1;min-width:220px;font-weight:700;font-size:14.5px;white-space:pre-line;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}
.tag{padding:3px 9px;border-radius:99px;font-weight:700;background:var(--grbg);color:#3F3F46}.tag.acc{background:var(--accbg);color:var(--acc)}.tag.High{background:var(--rbg);color:#B91C1C}.tag.Medium{background:var(--obg);color:#B45309}.tag.Low{background:var(--grbg)}.tag.late{background:var(--r);color:#fff}
.rm{margin-top:8px;font-size:13px;color:#52525B;white-space:pre-line;line-height:1.5;background:#FAFAFA;border-radius:8px;padding:8px 10px}
.lks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;background:#FFF6D1;color:#7A5B00;text-decoration:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk svg{width:11px;height:11px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:flex-start}
.sb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.sb[aria-pressed="true"].NOTSTARTED{background:var(--rbg);border-color:#FCA5A5;color:#B91C1C}.sb[aria-pressed="true"].INPROGRESS{background:var(--obg);border-color:#FCD34D;color:#B45309}.sb[aria-pressed="true"].DONE{background:var(--gbg);border-color:#86EFAC;color:#15803D}.sb[aria-pressed="true"].PLAN{background:var(--bbg);color:#1D4ED8}
.note{flex:1;min-width:220px;display:flex;gap:6px}.note textarea{flex:1;border:1px solid #D2D2D7;border-radius:8px;padding:6px 9px;font-size:13px;resize:vertical;min-height:34px}
.upd{font-size:11.5px;color:var(--muted);margin-top:6px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:14px}
.banner{border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px}.banner.e{background:var(--rbg);color:#991B1B}.banner.w{background:var(--obg);color:#92400E}
.ql{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:8px}
.qlc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-decoration:none;font-size:13px;font-weight:600;color:inherit}.qlc:hover{border-color:var(--y)}
.qlc i{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accbg);font-style:normal}.qlc small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tools{margin-top:30px}.tools-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--y)}.tools-h h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.tools-h .sp{flex:1}#tState{font-size:12px;color:var(--muted)}
.tg{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.tg-h{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#FAFAFA;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tg-h .cnt{color:var(--muted);font-weight:700}.tg-h .sp{flex:1}.tg-h .gedit{display:none;gap:4px}.editing .tg-h .gedit{display:inline-flex}
.trow{display:grid;grid-template-columns:minmax(170px,1.05fr) minmax(230px,1.45fr) minmax(220px,1.25fr) 76px;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid #F1F1F3}
.trow.head{border-top:0;padding-top:9px;padding-bottom:9px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trow .nm{font-weight:800;font-size:14px;line-height:1.3}.trow .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.fld{display:flex;align-items:center;gap:4px;background:#F4F4F5;border:1px solid #E4E4E7;border-radius:9px;padding:3px 3px 3px 10px;min-height:34px;min-width:0}
.fld code{flex:1;min-width:0;font:600 12.5px ui-monospace,Menlo,monospace;color:#18181B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.fld.none{background:transparent;border-color:transparent;padding-left:2px}.fld.none code,.fld code.lock{color:#A1A1AA;font-family:var(--font);font-weight:500;cursor:default}
.ib{border:0;background:#fff;box-shadow:0 0 0 1px #E4E4E7;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;flex:none;color:inherit;text-decoration:none;white-space:nowrap}
.ib:hover{box-shadow:0 0 0 1px var(--y)}.ib.open{background:var(--ink);color:#fff;box-shadow:none}
.trow .act2{display:flex;gap:4px;justify-content:flex-end}.trow .ed{display:none;gap:4px}.editing .trow .ed{display:flex}.editing .trow .act2 .open{display:none}
.editing .trow{grid-template-columns:minmax(170px,1.05fr) minmax(230px,1.45fr) minmax(220px,1.25fr) 150px}
.tools .k{display:none}
.lnks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid #F1F1F3}.lnks-h{width:100%;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.lk2{display:inline-flex;align-items:center;gap:4px}.lk2 a{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-size:13px;max-width:100%}
.lk2 a:hover{border-color:var(--y);background:#FFFBEA}.lk2 a b{font-weight:700}.lk2 a small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.lk2 a em{font-style:normal;color:var(--muted);font-size:12px}
.lk2 .ed{display:none;gap:3px}.editing .lk2 .ed{display:inline-flex}
@media (max-width:760px){.trow{grid-template-columns:1fr;gap:8px;padding:14px}.trow.head{display:none}.tools .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.trow .act2{justify-content:flex-start}.editing .trow{grid-template-columns:1fr}.fld code{white-space:normal;word-break:break-all}.trow .emp{display:none}.trow .act2:empty{display:none}}
.unl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF8DB;border:1px solid #FDE68A;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:6px}.unl input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:180px}
.md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mdb{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.mdb h3{margin:0 0 14px}
.f{margin-bottom:12px}.f label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:6px}.mfoot .sp{flex:1}.btn.danger{color:var(--r)}.hidden{display:none!important}
.board{margin-top:30px}.bcols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.bcol{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.bh .sp{flex:1}.bh .cnt{color:var(--muted)}
.bcol .card{margin-bottom:8px}.card .ops{display:flex;gap:4px;margin-left:auto}.ib2{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}.ib2:hover{background:var(--grbg);color:var(--ink)}
.nf{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.nf textarea{border:1px solid #D2D2D7;border-radius:9px;padding:8px 10px;font-size:13px;min-height:64px;resize:vertical}
.nf .row{display:flex;gap:8px;align-items:center}.nf select{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;font-size:13px}
.nt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#FFFDF5}.nt.pin{border-color:var(--y);box-shadow:inset 3px 0 0 var(--y)}
.nt .nh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.nt .nh b{color:var(--ink)}.nt .tx{font-size:13.5px;white-space:pre-line;line-height:1.5;margin-top:5px}
.rs{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.rs:first-child{border-top:0}.rs b{flex:1;font-size:14px}.rs input{width:110px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
@media (max-width:860px){.bcols{grid-template-columns:1fr}}
.tag.spv{background:#FEF3C7;color:#92400E}.spvr{margin-top:8px;font-size:13px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:8px 10px;white-space:pre-line;line-height:1.5}.spvr b{color:#92400E}
.nt.tospv{background:#FFFBEB;border-color:#FDE68A}
.desks{margin-bottom:22px}.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.dk{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 12px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;overflow:hidden}
.dk::before{content:"";position:absolute;inset:0 0 auto;height:46px;background:var(--dc,var(--accbg))}.dk:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}.dk.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.av{position:relative;width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800;font-size:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--dc,var(--acc))}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.av.big{width:104px;height:104px;font-size:32px;border-width:4px}
.dk b{font-size:15px}.dk .tl{font-size:12px;color:var(--muted);min-height:16px;line-height:1.35}.dk .em{position:absolute;top:8px;right:10px;font-size:18px}
.dk .st{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:11px}.dk .st span{background:var(--grbg);border-radius:99px;padding:2px 8px;font-weight:700}
.dsk{max-width:900px}.dsk-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:-20px -22px 16px;padding:22px;border-radius:16px 16px 0 0;background:linear-gradient(135deg,var(--dc,var(--accbg)),#fff 80%)}
.dsk-h h3{margin:0;font-size:22px}.dsk-h p{margin:3px 0 0;color:#52525B;font-size:13.5px}.dsk-h .sp{flex:1}
.dtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tpbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tpbar input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg)}
.tps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tp{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}.tp:hover{border-color:var(--y)}
.tp .tph{display:flex;gap:6px;align-items:flex-start}.tp .tph b{flex:1;font-size:13.5px}.tp .tx{font-size:12.8px;color:#3F3F46;white-space:pre-wrap;line-height:1.45;max-height:118px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.tp .tx.open{max-height:none;-webkit-mask-image:none}.tp .tf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto}.tp .tf small{color:var(--muted);font-size:11px;margin-right:auto}
.cbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:2px 0 10px}.tp .tag{font-size:11px;padding:2px 8px}
@media (max-width:640px){.dgrid{grid-template-columns:repeat(2,1fr)}.dsk-h{margin:-20px -16px 14px}.mdb{padding:20px 16px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
@media (max-width:640px){.top{padding:10px 12px;gap:6px}.top .logo{height:20px}.top .btn{padding:6px 8px;font-size:12px}.kpis{grid-template-columns:repeat(2,1fr)}.who{margin-left:0;width:100%}main{padding:18px 12px 50px}}
</style>
</head>
<body>
<header class="top"><a href="/"><img class="logo" src="wordmark.png" alt="GlobalXtreme"></a><div class="sp"></div><a class="btn" id="switch" href="/dashboard-am"></a><a class="btn" href="/">Home</a></header>
<main>
  <div class="hero"><div class="ic" id="heroIc">🎧</div><div><h1 id="title"></h1><p id="sub"></p></div>
    <label class="who">I am: <select id="me"></select><button class="btn" id="teamBtn" type="button" title="Add / remove team members">👥 Team</button></label></div>
  <section class="desks"><div class="tools-h"><h2>Desks</h2><span class="sp"></span><span style="font-size:12px;color:var(--muted)">Each person's own desk — photo, message templates, tasks &amp; notes.</span><button class="btn pri" id="myDesk" type="button">🪑 My desk</button></div><div class="dgrid" id="desks"></div></section>
  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar" id="filter"></div>
  <div id="list"></div>
  <section class="board"><div class="tools-h"><h2>Team tasks &amp; notes</h2><span class="sp"></span><span id="bState" style="font-size:12px;color:var(--muted)">Create your own tasks, assign to a teammate, and leave notes for the team.</span></div>
    <div class="bcols"><div class="bcol"><div class="bh">Team tasks <span class="cnt" id="btCnt"></span><span class="sp"></span><button class="btn pri" id="btAdd" type="button">+ New task</button></div><div id="btList"></div></div>
      <div class="bcol"><div class="bh">Notes <span class="cnt" id="ntCnt"></span></div>
        <form class="nf" id="nForm"><textarea id="nTx" maxlength="3000" placeholder="Take a note for yourself or the team…"></textarea><div class="row"><select id="nTo"></select><button class="btn pri">Post note</button></div></form><div id="nList"></div></div></div></section>
  <section class="tools"><div class="tools-h"><h2>Tools &amp; Access</h2><span class="sp"></span><span id="tState"></span><button class="btn hidden" id="tEdit">✎ Edit tools</button><button class="btn hidden" id="tLogin">🔒 SPV login to edit</button></div>
    <div id="tUnlock"></div><div id="tools"></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
/* Dashboard tim — terbuka untuk tim (tanpa password). Hanya menampilkan task yang di-assign SPV ke tim ini.
   Tim bisa mengubah status & menulis catatan; tidak bisa membuat, menghapus atau me-assign task. */
const TEAM = /dashboard-am/i.test(location.pathname) || new URLSearchParams(location.search).get('t') === 'am' ? 'AM' : 'HD';
const CFGS = {
  HD: { title: 'Dashboard Helpdesk', sub: 'Helpdesk Customer Support To-Do List · update status & notes right here', icon: '🎧',
        roster: [['Kadek Arisita Dhyana Putri', 'Sita'], ['Gede Dimas Pery Narendra', 'Dimas'], ['Bayu Sukma Ramadhan', 'Bayu'], ['A.A Ngurah Kiyana Adhisa Oka Pertama', 'Oka'], ['Nilma Syahrani', 'Rani']],
        links: [['📘', 'SOP Flow Handling Helpdesk', 'Notion', 'https://melon-lime-e28.notion.site/SOP-Flow-Handling-Helpdesk-1d69b0fbceac80b98317da1a66743b16'],
                ['💬', 'GX CS Connect', 'Customer Support', 'https://gxcsconnect.globalxtreme-solutions.net/'],
                ['🗂', 'CSO Workspace', 'Observation details', 'https://cso-workspace.vercel.app'], ['📚', 'Knowledge Base', 'Helpdesk', '/knowledge-base#hd'], ['🎯', 'Quiz', 'Knowledge Base quiz (locked)', '/knowledge-base#quiz']] },
  AM: { title: 'Dashboard Account Manager', sub: 'Account Manager VIP To-Do List · update status & notes right here', icon: '💼',
        roster: [['Ni Kadek Desi Mirayani', 'Desi'], ['Aulia Sevi Diana', 'Sevia'], ['Devin Bagaskara', 'Bagas']],
        links: [['📘', 'Flow Account Manager', 'Notion', 'https://app.notion.com/p/Flow-Account-Manager-2fe9b0fbceac808ba433d9149a7d0a4f'],
                ['📗', 'VIP Group Monitoring', 'Tracking sheet', 'https://docs.google.com/spreadsheets/d/1nfn0cazlhz0Vck7vz5WikBnIV9LFTBWZXLfk8Q34xuk/edit?gid=480098290#gid=480098290'],
                ['📒', 'Dashboard VIP', 'VIP Masterlist (live)', '/dashboard-vip'],
                ['🗂', 'CSO Workspace', 'Observation details', 'https://cso-workspace.vercel.app'], ['📚', 'Knowledge Base', 'Account Manager', '/knowledge-base#am'], ['🎯', 'Quiz', 'Knowledge Base quiz (locked)', '/knowledge-base#quiz']] },
};
const CFG = CFGS[TEAM];
const $ = s => document.querySelector(s);

      ${DK.canEdit ? `<label class="btn" style="cursor:pointer">📷 Photo<input type="file" accept="image/*" id="dPhoto" hidden></label><button class="btn" data-dprof type="button">✎ Profile</button>` : ''}<button class="btn" data-dx type="button">✕</button></div>
    ${DK.canEdit ? '' : `<form class="unl" id="dUnl">🔒 Enter the team password to edit desks (photo &amp; templates). Reading &amp; copying templates is open.<input type="password" id="dPw" placeholder="Team password" autocomplete="current-password"><button class="btn pri">Unlock</button></form>`}
    <div class="dtabs">${[['tpl', '💬 Templates · ' + (d.tpls || []).length], ['task', '📋 Tasks · ' + (T.filter(t => t.status !== 'DONE').length + S.filter(t => t.status !== 'DONE').length)], ['note', '🗒 Notes · ' + N.length]].map(([k, l]) => `<button class="chip" data-dtab="${k}" aria-pressed="${DK.tab === k}" type="button">${l}</button>`).join('')}</div>
    <div id="dBody"></div></div>`;
  const u = el.querySelector('#dUnl'); if (u) u.onsubmit = async e => { e.preventDefault(); const pw = el.querySelector('#dPw').value; if (!pw) return;
    const r = await jget('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ team: 1, password: pw }) });
    if (r && r.status === 200) { toast('Unlocked ✓'); await Promise.all([loadDesk(), loadBoard()]); } else toast('Wrong password'); };
  const B = el.querySelector('#dBody');
  if (DK.tab === 'tpl') { const cats = [...new Set((d.tpls || []).map(t => t.cat).filter(Boolean))].sort();
    B.innerHTML = `<div class="tpbar"><input id="tpQ" type="search" placeholder="Search templates…" value="${esc(DK.q)}"><input id="tpCust" placeholder="Customer name → fills {nama}" value="${esc(DK.cust)}" style="max-width:240px">${DK.canEdit ? '<button class="btn pri" data-tadd type="button">+ Template</button>' : ''}</div>
      ${cats.length ? `<div class="bar" style="margin-bottom:10px"><button class="chip" data-tcat="" aria-pressed="${!DK.cat}" type="button">All</button>${cats.map(c => `<button class="chip" data-tcat="${esc(c)}" aria-pressed="${DK.cat === c}" type="button">${esc(c)}</button>`).join('')}</div>` : ''}
      <p class="hint">Click <b>Copy</b> and paste into the chat. Variables: <code>{nama}</code> customer name, <code>{agent}</code> ${esc(nick(n))}, <code>{tanggal}</code> today. Don't save customer phone numbers / emails in templates.</p><div class="tps" id="tps"></div>`;
    drawTpls(); }
  else if (DK.tab === 'task') { const row = (t, src) => `<div class="card ${t.status === 'DONE' ? 'done' : ''}"><div class="ch"><div class="ti">${esc(t.title)}</div></div><div class="meta"><span class="tag">${src}</span><span class="tag">${esc(t.status)}</span>${t.assignee === 'SPV' ? '<span class="tag spv">⭐ Sent to SPV</span>' : ''}${t.due ? `<span class="tag">Due ${fmtD(t.due)}</span>` : ''}</div>${t.spvReply ? `<div class="spvr"><b>⭐ SPV:</b> ${esc(t.spvReply)}</div>` : ''}</div>`;
    const all = [...S.map(t => row(t, 'From SPV')), ...T.map(t => row(t, t.assignee === 'SPV' ? 'Review request' : 'Team task'))];
    B.innerHTML = all.length ? all.join('') : '<div class="empty" style="padding:18px">No tasks for this person.</div>'; }
  else B.innerHTML = N.length ? N.map(x => `<div class="nt ${x.to === 'SPV' ? 'tospv' : ''}"><div class="nh"><b>${esc(x.by ? nick(x.by) : '—')}</b>${x.to ? ` → <b>${esc(nick(x.to))}</b>` : ''} · ${fmtT(x.at)}</div><div class="tx">${esc(x.text)}</div>${x.spvReply ? `<div class="spvr"><b>⭐ SPV:</b> ${esc(x.spvReply)}</div>` : ''}</div>`).join('') : '<div class="empty" style="padding:18px">No notes yet.</div>';
}
function drawTpls() {
  const box = $('#tps'); if (!box) return; const n = DK.open, d = deskOf(n), q = DK.q.toLowerCase();
  const L = (d.tpls || []).filter(t => (!DK.cat || t.cat === DK.cat) && (!q || (t.title + ' ' + t.text + ' ' + (t.cat || '')).toLowerCase().includes(q))).sort((a, b) => (b.uses || 0) - (a.uses || 0));
  box.innerHTML = L.length ? L.map(t => `<div class="tp" data-tp="${esc(t.id)}"><div class="tph"><b>${esc(t.title)}</b>${t.cat ? `<span class="tag acc">${esc(t.cat)}</span>` : ''}</div><div class="tx">${esc(t.text)}</div>
      <div class="tf"><small>${t.uses ? `copied ${t.uses}×` : ''}</small><button class="ib2" data-tmore type="button" title="Show all">⤢</button>${DK.canEdit ? `<button class="ib2" data-tedit type="button" title="Edit">✎</button><button class="ib2" data-tdel type="button" title="Delete">🗑</button>` : ''}${DK.canEdit && ME && ME !== n ? '<button class="ib" data-tclone type="button" title="Copy to my desk">+ My desk</button>' : ''}<button class="cbtn" data-tcopy type="button">Copy</button></div></div>`).join('')
    : `<div class="empty" style="padding:18px;grid-column:1/-1">${(d.tpls || []).length ? 'No template matches.' : 'No templates yet.' + (DK.canEdit ? ' Click <b>+ Template</b> to add your quick replies.' : '')}</div>`;
}
function tplModal(t) {
  const el = document.createElement('div'); el.className = 'md'; el.style.zIndex = 60;
  const cats = [...new Set(Object.values(DK.data.desks).flatMap(d => (d.tpls || []).map(x => x.cat)).filter(Boolean))];
  el.innerHTML = `<form class="mdb"><h3>${t ? 'Edit template' : 'New template'} — ${esc(nick(DK.open))}</h3>
    <div class="f"><label>Title</label><input data-f="title" maxlength="120" required value="${esc(t ? t.title : '')}" placeholder="e.g. Greeting pagi / Info gangguan / Reminder billing"></div>
    <div class="f"><label>Category (optional)</label><input data-f="cat" maxlength="40" list="tcats" value="${esc(t ? t.cat : '')}" placeholder="Greeting / Gangguan / Billing / Closing"><datalist id="tcats">${cats.map(c => `<option>${esc(c)}</option>`).join('')}</datalist></div>
    <div class="f"><label>Message — {nama} = customer name, {agent} = your name, {tanggal} = today</label><textarea data-f="text" rows="9" maxlength="4000" required>${esc(t ? t.text : '')}</textarea></div>
    <div class="mfoot"><span class="sp"></span><button type="button" class="btn" data-x>Cancel</button><button class="btn pri">${t ? 'Save' : 'Add template'}</button></div></form>`;
  document.body.appendChild(el); el.querySelector('input').focus();
  el.onclick = e => { if (e.target === el || e.target.closest('[data-x]')) el.remove(); };
  el.querySelector('form').onsubmit = async e => { e.preventDefault(); const v = k => el.querySelector(`[data-f="${k}"]`).value;
    if (!v('title').trim() || !v('text').trim()) return;
    if (await dop({ op: t ? 'tpl.upd' : 'tpl.add', name: DK.open, id: t && t.id, title: v('title').trim(), cat: v('cat').trim(), text: v('text') })) el.remove(); };
}
function profModal() {
  const d = deskOf(DK.open), el = document.createElement('div'); el.className = 'md'; el.style.zIndex = 60;
  el.innerHTML = `<form class="mdb" style="max-width:440px"><h3>✎ Desk profile — ${esc(nick(DK.open))}</h3>
    <div class="f"><label>Tagline / status</label><input data-f="tagline" maxlength="80" value="${esc(d.tagline || '')}" placeholder="e.g. Fast reply, slow coffee ☕"></div>
    <div class="f"><label>Emoji</label><input data-f="emoji" maxlength="8" value="${esc(d.emoji || '')}" placeholder="🐣"></div>
    <div class="f"><label>Desk color</label><div style="display:flex;gap:8px;flex-wrap:wrap">${COLORS.map(c => `<label style="cursor:pointer"><input type="radio" name="dc" value="${c}" ${dColor(DK.open) === c ? 'checked' : ''} hidden><span style="display:inline-block;width:30px;height:30px;border-radius:50%;background:${c};border:2px solid ${dColor(DK.open) === c ? '#1D1D1F' : '#E5E5EA'}"></span></label>`).join('')}</div></div>
    ${d.photo ? '<p><button type="button" class="btn danger" data-rmph>Remove uploaded photo</button></p>' : ''}
    <div class="mfoot"><span class="sp"></span><button type="button" class="btn" data-x>Cancel</button><button class="btn pri">Save</button></div></form>`;
  document.body.appendChild(el);
  el.onchange = e => { if (e.target.name === 'dc') el.querySelectorAll('[name=dc]').forEach(r => r.nextElementSibling.style.borderColor = r.checked ? '#1D1D1F' : '#E5E5EA'); };
  el.onclick = async e => { if (e.target === el || e.target.closest('[data-x]')) return el.remove(); if (e.target.closest('[data-rmph]') && await dop({ op: 'photo', name: DK.open, photo: '' })) el.remove(); };
  el.querySelector('form').onsubmit = async e => { e.preventDefault(); const c = el.querySelector('[name=dc]:checked');
    if (await dop({ op: 'profile', name: DK.open, tagline: el.querySelector('[data-f=tagline]').value.trim(), emoji: el.querySelector('[data-f=emoji]').value.trim(), color: c ? c.value : '' })) el.remove(); };
}
function shrink(file) { return new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => { const S = 256, c = document.createElement('canvas'); c.width = c.height = S; const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.84)); };
  img.onerror = () => no(new Error('bad image')); img.src = u; }); }
async function deskChange(e) {
  if (e.target.id !== 'dPhoto' || !e.target.files[0]) return;
  try { const ph = await shrink(e.target.files[0]); await dop({ op: 'photo', name: DK.open, photo: ph }); } catch (er) { toast('Could not read that image'); }
}
async function deskClick(e) {
  const el = $('#deskMd'); if (e.target === el || e.target.closest('[data-dx]')) return closeDesk();
  const tb = e.target.closest('[data-dtab]'); if (tb) { DK.tab = tb.dataset.dtab; return drawDesk(); }
  const tc = e.target.closest('[data-tcat]'); if (tc) { DK.cat = tc.dataset.tcat; return drawDesk(); }
  if (e.target.closest('[data-dprof]')) return profModal();
  if (e.target.closest('[data-tadd]')) return tplModal(null);
  const card = e.target.closest('[data-tp]'); if (!card) return; const t = (deskOf(DK.open).tpls || []).find(x => x.id === card.dataset.tp); if (!t) return;
  if (e.target.closest('[data-tcopy]')) { const tx = fillVars(t.text, DK.open);
    try { await navigator.clipboard.writeText(tx); toast(/\{nama\}/i.test(tx) ? 'Copied ✓ — {nama} still empty' : 'Copied ✓'); } catch (er) { prompt('Copy:', tx); }
    if (DK.canEdit) dop({ op: 'tpl.use', name: DK.open, id: t.id }, true); return; }
  if (e.target.closest('[data-tmore]')) return card.querySelector('.tx').classList.toggle('open');
  if (e.target.closest('[data-tedit]')) return tplModal(t);
  if (e.target.closest('[data-tdel]') && confirm('Delete template "' + t.title + '"?')) return dop({ op: 'tpl.del', name: DK.open, id: t.id });
  if (e.target.closest('[data-tclone]')) { if (await dop({ op: 'tpl.add', name: ME, title: t.title, cat: t.cat, text: t.text }, true)) toast('Added to your desk ✓'); }
}
$('#desks').onclick = e => { const d = e.target.closest('[data-desk]'); if (d) openDesk(d.dataset.desk); };
$('#desks').onkeydown = e => { const d = e.target.closest('[data-desk]'); if (d && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDesk(d.dataset.desk); } };
$('#myDesk').onclick = () => { if (!ME) { toast('Select your name first (top right)'); $('#me').focus(); return; } openDesk(ME); };
addEventListener('keydown', e => { if (e.key === 'Escape' && DK.open && !document.querySelector('.md[style*="z-index"]')) closeDesk(); });
load(); loadBoard(); loadDesk(); setInterval(() => { if (!document.hidden && !document.activeElement.matches('textarea,input') && !document.querySelector('.md')) { load(); loadBoard(); loadDesk(); } }, 60000);
</script>
</body>
